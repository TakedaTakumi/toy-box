<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スノードーム</title>
<style>
  :root {
    --bg: #e9eef7;
    --ink: #1b2640;
    --muted: #55627f;
    --chip: #ffffff;
    --chip-line: #cdd6e8;
    --btn: #2f4d9e;
    --btn-ink: #ffffff;
    --focus: #2f4d9e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1020;
      --ink: #e7ecfa;
      --muted: #94a3c6;
      --chip: #151c33;
      --chip-line: #2a3556;
      --btn: #9db2ff;
      --btn-ink: #0b1020;
      --focus: #9db2ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1020;
    --ink: #e7ecfa;
    --muted: #94a3c6;
    --chip: #151c33;
    --chip-line: #2a3556;
    --btn: #9db2ff;
    --btn-ink: #0b1020;
    --focus: #9db2ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    overflow: hidden;
    overscroll-behavior: none;
  }
  main {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  header { text-align: center; }
  h1 { margin: 0; font-size: 1.15rem; letter-spacing: .12em; }
  #status {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 12px;
    border: 1px solid var(--chip-line);
    border-radius: 999px;
    background: var(--chip);
    color: var(--muted);
    font-size: .8rem;
  }
  #stage {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    display: block;
    width: min(100%, 520px, calc((100svh - 306px) * 500 / 560));
    height: auto;
    aspect-ratio: 500 / 560;
    touch-action: none;
    cursor: grab;
    -webkit-tap-highlight-color: transparent;
  }
  canvas:active { cursor: grabbing; }
  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  button {
    font: inherit;
    font-size: .95rem;
    padding: 8px 20px;
    border: 0;
    border-radius: 999px;
    background: var(--btn);
    color: var(--btn-ink);
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .seasons { display: flex; gap: 8px; }
  .seasons button { padding: 6px 18px; background: var(--chip); color: var(--ink); border: 1px solid var(--chip-line); }
  .seasons button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
  .amount { display: flex; align-items: center; gap: 10px; width: min(100%, 360px); color: var(--muted); font-size: .85rem; }
  .amount span { min-width: 5em; }
  .amount input { flex: 1; min-width: 0; accent-color: var(--btn); }
  .amount output { min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
  .hint { margin: 0; color: var(--muted); font-size: .8rem; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>スノードーム</h1>
    <span id="status" role="status" aria-live="polite">ジャイロ: 確認中…</span>
  </header>
  <div id="stage"><canvas id="globe" aria-label="スノードーム。傾けたり振ったりすると、中のものが舞います"></canvas></div>
  <div class="seasons" role="group" aria-label="季節">
    <button type="button" data-season="spring" aria-pressed="false">春</button>
    <button type="button" data-season="summer" aria-pressed="false">夏</button>
    <button type="button" data-season="autumn" aria-pressed="false">秋</button>
    <button type="button" data-season="winter" aria-pressed="false">冬</button>
  </div>
  <label class="amount" for="amount"><span id="amountLabel">雪の量</span>
    <input id="amount" type="range" min="50" max="600" step="10" value="240">
    <output id="amountOut" for="amount">240</output>
  </label>
  <label class="amount" for="fluff"><span>ふわふわ度</span>
    <input id="fluff" type="range" min="0" max="100" step="5" value="70">
    <output id="fluffOut" for="fluff">70</output>
  </label>
  <div class="controls">
    <button id="enable" type="button" hidden>ジャイロを使う</button>
    <button id="shake" type="button">ふる</button>
  </div>
  <p class="hint">スマホを傾ける・振る。ジャイロがなければ、ドームをドラッグ</p>
</main>
<script>
(() => {
  const W = 500, H = 560, CX = 250, CY = 235, R = 200;
  const FLOOR = CY + 0.6 * R;
  const LIP = 388;
  const GLASS = 4, PILE = 9;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COUNT = reduceMotion ? 110 : 240;
  const COUNT_MAX = reduceMotion ? 300 : 600;
  const GRAVITY = reduceMotion ? 70 : 100;
  const SWAY = reduceMotion ? 8 : 38;
  const FLUFF_DEFAULT = 70, FLUFF_BASE = 40;
  const SEASONS = {
    spring: { kind: 'petal', size: 1.5, gm: 0.8, sm: 1.3, buoyant: false, label: '花びらの量', pal: ['#ffd3df', '#ffb7cd', '#ff9fba', '#fff0f4'] },
    summer: { kind: 'bubble', size: 1.7, gm: 0.9, sm: 0.8, buoyant: true, label: '泡の量' },
    autumn: { kind: 'leaf', size: 1.9, gm: 1, sm: 1.1, buoyant: false, label: '落ち葉の量', pal: ['#d6402b', '#e8742a', '#f0a830', '#b5532a'] },
    winter: { kind: 'snow', size: 1, gm: 1, sm: 1, buoyant: false, label: '雪の量' },
  };
  function seasonOf(d) {
    const m = d.getMonth() + 1;
    if (m >= 3 && m <= 5) return 'spring';
    if (m >= 6 && m <= 8) return 'summer';
    if (m >= 9 && m <= 11) return 'autumn';
    return 'winter';
  }
  let season = seasonOf(new Date());
  let S = SEASONS[season];

  const canvas = document.getElementById('globe');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const enableBtn = document.getElementById('enable');
  const shakeBtn = document.getElementById('shake');

  let scale = 1, backLayer = null, frontLayer = null;

  function makeLayer(draw) {
    const c = document.createElement('canvas');
    c.width = canvas.width;
    c.height = canvas.height;
    const g = c.getContext('2d');
    g.scale(scale, scale);
    draw(g);
    return c;
  }

  function rng(seed) {
    let s = seed;
    return () => (s = (s * 16807) % 2147483647) / 2147483647;
  }

  function tree(g, x, baseY, h, w) {
    g.fillStyle = '#4a3326';
    g.fillRect(x - 3, baseY - 6, 6, 8);
    for (let i = 0; i < 3; i++) {
      const top = baseY - 6 - h + i * (h * 0.26);
      const bottom = baseY - 6 - h * 0.18 * (2 - i) - (i === 2 ? 0 : 0);
      const half = w * (0.5 + i * 0.25) / 1.5;
      g.fillStyle = i % 2 ? '#1f5a45' : '#27694f';
      g.beginPath();
      g.moveTo(x, top);
      g.lineTo(x + half, bottom);
      g.lineTo(x - half, bottom);
      g.closePath();
      g.fill();
      g.fillStyle = 'rgba(240,247,255,.92)';
      g.beginPath();
      g.moveTo(x, top);
      g.lineTo(x + half * 0.55, top + (bottom - top) * 0.55);
      g.quadraticCurveTo(x, top + (bottom - top) * 0.42, x - half * 0.55, top + (bottom - top) * 0.55);
      g.closePath();
      g.fill();
    }
  }

  function house(g, x, baseY, o = {}) {
    const w = 78, h = 52;
    const glow = g.createRadialGradient(x + 4, baseY - 28, 2, x + 4, baseY - 28, 70);
    glow.addColorStop(0, 'rgba(255,196,96,.38)');
    glow.addColorStop(1, 'rgba(255,196,96,0)');
    g.fillStyle = glow;
    g.fillRect(x - 80, baseY - 100, 170, 120);
    g.fillStyle = '#6b4a3a';
    g.fillRect(x - w / 2, baseY - h, w, h);
    g.fillStyle = '#5a3d30';
    g.fillRect(x + 20, baseY - h - 22, 12, 24);
    g.fillStyle = o.cap || 'rgba(240,247,255,.95)';
    g.fillRect(x + 18, baseY - h - 26, 16, 6);
    g.fillStyle = o.roof || '#3d2a24';
    g.beginPath();
    g.moveTo(x - w / 2 - 8, baseY - h + 2);
    g.lineTo(x, baseY - h - 36);
    g.lineTo(x + w / 2 + 8, baseY - h + 2);
    g.closePath();
    g.fill();
    g.fillStyle = o.cap || 'rgba(244,249,255,.96)';
    g.beginPath();
    g.moveTo(x - w / 2 - 10, baseY - h + 3);
    g.lineTo(x, baseY - h - 39);
    g.lineTo(x + w / 2 + 10, baseY - h + 3);
    g.lineTo(x + w / 2 + 2, baseY - h - 3);
    g.quadraticCurveTo(x, baseY - h - 24, x - w / 2 - 2, baseY - h - 3);
    g.closePath();
    g.fill();
    g.fillStyle = '#ffc46a';
    g.fillRect(x - 28, baseY - 38, 18, 18);
    g.fillRect(x + 12, baseY - 38, 18, 18);
    g.fillStyle = '#5a3d30';
    g.fillRect(x - 28, baseY - 30, 18, 2);
    g.fillRect(x - 20, baseY - 38, 2, 18);
    g.fillRect(x + 12, baseY - 30, 18, 2);
    g.fillRect(x + 20, baseY - 38, 2, 18);
    g.fillStyle = '#3d2a24';
    g.fillRect(x - 6, baseY - 26, 12, 26);
  }

  function paintWinter(g) {
    g.save();
    g.beginPath();
    g.arc(CX, CY, R - 1, 0, Math.PI * 2);
    g.clip();
    const sky = g.createRadialGradient(CX, CY - 80, 20, CX, CY, R);
    sky.addColorStop(0, '#2c4a86');
    sky.addColorStop(0.6, '#16295a');
    sky.addColorStop(1, '#0a1533');
    g.fillStyle = sky;
    g.fillRect(0, 0, W, H);
    const rand = rng(7);
    for (let i = 0; i < 46; i++) {
      const a = rand() * Math.PI * 2, d = Math.sqrt(rand()) * R * 0.9;
      g.fillStyle = `rgba(255,255,255,${0.25 + rand() * 0.5})`;
      g.fillRect(CX + Math.cos(a) * d, CY + Math.sin(a) * d * 0.9 - 20, 1.4, 1.4);
    }
    const moon = g.createRadialGradient(CX + 92, CY - 96, 2, CX + 92, CY - 96, 26);
    moon.addColorStop(0, 'rgba(255,248,220,1)');
    moon.addColorStop(0.45, 'rgba(255,248,220,.9)');
    moon.addColorStop(1, 'rgba(255,248,220,0)');
    g.fillStyle = moon;
    g.fillRect(CX + 60, CY - 130, 70, 70);
    tree(g, CX - 112, FLOOR + 2, 78, 50);
    tree(g, CX + 108, FLOOR + 2, 96, 58);
    tree(g, CX + 74, FLOOR + 2, 58, 40);
    house(g, CX - 18, FLOOR + 2);
    const snow = g.createLinearGradient(0, FLOOR - 6, 0, 400);
    snow.addColorStop(0, '#f2f8ff');
    snow.addColorStop(1, '#aebfdc');
    g.fillStyle = snow;
    g.beginPath();
    g.moveTo(0, 410);
    g.lineTo(0, FLOOR + 2);
    for (let x = 0; x <= W; x += 10) g.lineTo(x, FLOOR + 2 - Math.sin(x * 0.045) * 2.4 - Math.sin(x * 0.11) * 1.2);
    g.lineTo(W, 410);
    g.closePath();
    g.fill();
    g.restore();
    paintBase(g);
  }

  function paintBase(g) {
    const shadow = g.createRadialGradient(CX, 528, 10, CX, 528, 210);
    shadow.addColorStop(0, 'rgba(0,0,0,.32)');
    shadow.addColorStop(1, 'rgba(0,0,0,0)');
    g.save();
    g.translate(0, 528);
    g.scale(1, 0.12);
    g.translate(0, -528);
    g.fillStyle = shadow;
    g.fillRect(0, 300, W, 460);
    g.restore();

    const body = g.createLinearGradient(0, 400, 0, 522);
    body.addColorStop(0, '#6b4130');
    body.addColorStop(1, '#341c14');
    g.fillStyle = body;
    g.beginPath();
    g.moveTo(CX - 152, 404);
    g.lineTo(CX + 152, 404);
    g.lineTo(CX + 196, 506);
    g.quadraticCurveTo(CX + 198, 522, CX + 180, 522);
    g.lineTo(CX - 180, 522);
    g.quadraticCurveTo(CX - 198, 522, CX - 196, 506);
    g.closePath();
    g.fill();
    g.fillStyle = 'rgba(255,255,255,.07)';
    g.fillRect(CX - 170, 450, 340, 2);
    const gold = g.createLinearGradient(0, LIP, 0, LIP + 22);
    gold.addColorStop(0, '#f2d08a');
    gold.addColorStop(0.5, '#c79a45');
    gold.addColorStop(1, '#8a6425');
    g.fillStyle = gold;
    g.beginPath();
    g.roundRect(CX - 160, LIP, 320, 22, 10);
    g.fill();
  }

  function clipDome(g) {
    g.beginPath();
    g.arc(CX, CY, R - 1, 0, Math.PI * 2);
    g.clip();
  }

  function skyFill(g, stops) {
    const sky = g.createRadialGradient(CX, CY - 80, 20, CX, CY, R);
    for (const [o, c] of stops) sky.addColorStop(o, c);
    g.fillStyle = sky;
    g.fillRect(0, 0, W, H);
  }

  function glow(g, x, y, r, rgb) {
    const gr = g.createRadialGradient(x, y, 2, x, y, r);
    gr.addColorStop(0, `rgba(${rgb},1)`);
    gr.addColorStop(0.45, `rgba(${rgb},.85)`);
    gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }

  function groundFill(g, top, bottom, wave) {
    const gr = g.createLinearGradient(0, FLOOR - 6, 0, 400);
    gr.addColorStop(0, top);
    gr.addColorStop(1, bottom);
    g.fillStyle = gr;
    g.beginPath();
    g.moveTo(0, 410);
    g.lineTo(0, FLOOR + 2);
    for (let x = 0; x <= W; x += 10) g.lineTo(x, FLOOR + 2 - Math.sin(x * 0.045) * wave - Math.sin(x * 0.11) * wave * 0.5);
    g.lineTo(W, 410);
    g.closePath();
    g.fill();
  }

  function roundTree(g, x, baseY, h, w, colors) {
    g.fillStyle = '#5a3d30';
    g.fillRect(x - 3, baseY - h * 0.5, 6, h * 0.5 + 2);
    const blobs = [[0, -0.8, 0.5], [-0.34, -0.6, 0.4], [0.34, -0.62, 0.4], [-0.16, -1, 0.34], [0.2, -0.98, 0.32]];
    blobs.forEach(([ox, oy, or], i) => {
      g.fillStyle = colors[i % colors.length];
      g.beginPath();
      g.arc(x + ox * w, baseY + oy * h, or * w, 0, Math.PI * 2);
      g.fill();
    });
  }

  function scatter(g, seed, n, colors, y0, y1, rx, ry) {
    const rand = rng(seed);
    for (let i = 0; i < n; i++) {
      g.fillStyle = colors[i % colors.length];
      g.beginPath();
      g.ellipse(CX - R + rand() * R * 2, y0 + rand() * (y1 - y0), rx, ry, rand() * 3, 0, Math.PI * 2);
      g.fill();
    }
  }

  function paintSpring(g) {
    g.save();
    clipDome(g);
    skyFill(g, [[0, '#fbe0e6'], [0.55, '#d3a9d4'], [1, '#6c78b8']]);
    glow(g, CX + 92, CY - 96, 34, '255,244,214');
    g.fillStyle = 'rgba(120,130,190,.4)';
    g.beginPath();
    g.moveTo(0, FLOOR - 24);
    for (let x = 0; x <= W; x += 10) g.lineTo(x, FLOOR - 30 - Math.sin(x * 0.02 + 1) * 14);
    g.lineTo(W, FLOOR);
    g.lineTo(0, FLOOR);
    g.closePath();
    g.fill();
    roundTree(g, CX - 112, FLOOR + 2, 92, 64, ['#f6b3c9', '#f9c6d6', '#ee9db8']);
    roundTree(g, CX + 108, FLOOR + 2, 112, 78, ['#f9c6d6', '#f6b3c9', '#ee9db8']);
    roundTree(g, CX + 70, FLOOR + 2, 64, 46, ['#ee9db8', '#f9c6d6']);
    house(g, CX - 18, FLOOR + 2, { roof: '#8b3a3a', cap: '#b5605a' });
    groundFill(g, '#c7e8a8', '#6aa96a', 2.4);
    scatter(g, 11, 40, ['#ffd3df', '#ffb7cd'], FLOOR + 4, 392, 2.6, 1.5);
    g.restore();
    paintBase(g);
  }

  function paintAutumn(g) {
    g.save();
    clipDome(g);
    skyFill(g, [[0, '#f9cd77'], [0.5, '#e0814e'], [1, '#5b3a73']]);
    glow(g, CX + 86, FLOOR - 84, 38, '255,236,170');
    roundTree(g, CX - 112, FLOOR + 2, 92, 64, ['#d6402b', '#e8742a', '#f0a830']);
    roundTree(g, CX + 108, FLOOR + 2, 112, 78, ['#e8742a', '#d6402b', '#f0a830']);
    roundTree(g, CX + 70, FLOOR + 2, 64, 46, ['#f0a830', '#e8742a']);
    house(g, CX - 18, FLOOR + 2, { roof: '#5a3a2a', cap: '#8a5a3c' });
    groundFill(g, '#b4743a', '#5e3a1c', 2.4);
    scatter(g, 23, 46, ['#d6402b', '#e8742a', '#f0a830', '#b5532a'], FLOOR + 4, 392, 3, 1.7);
    g.restore();
    paintBase(g);
  }

  function seaweed(g, x, baseY, h, color) {
    g.strokeStyle = color;
    g.lineWidth = 5;
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(x, baseY);
    g.bezierCurveTo(x - 14, baseY - h * 0.3, x + 14, baseY - h * 0.6, x, baseY - h);
    g.stroke();
  }

  function coral(g, x, baseY, color) {
    g.strokeStyle = color;
    g.lineWidth = 7;
    g.lineCap = 'round';
    for (const [dx, dy, ex, ey] of [[0, 0, 0, -46], [0, -24, -16, -44], [0, -30, 18, -56], [0, -14, 14, -30]]) {
      g.beginPath();
      g.moveTo(x + dx, baseY + dy);
      g.lineTo(x + ex, baseY + ey);
      g.stroke();
    }
  }

  function star(g, x, y, r, color) {
    g.fillStyle = color;
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, d = i % 2 ? r * 0.45 : r;
      if (i) g.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d);
      else g.moveTo(x + Math.cos(a) * d, y + Math.sin(a) * d);
    }
    g.closePath();
    g.fill();
  }

  function paintSummer(g) {
    g.save();
    clipDome(g);
    const water = g.createLinearGradient(0, CY - R, 0, FLOOR + 40);
    water.addColorStop(0, '#6fe0ea');
    water.addColorStop(0.45, '#2aa3c8');
    water.addColorStop(1, '#0c4a7a');
    g.fillStyle = water;
    g.fillRect(0, 0, W, H);
    const surface = g.createRadialGradient(CX, CY - R, 4, CX, CY - R, 190);
    surface.addColorStop(0, 'rgba(255,255,255,.45)');
    surface.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = surface;
    g.fillRect(0, 0, W, H);
    seaweed(g, CX - 150, FLOOR + 4, 80, '#2f9e6a');
    seaweed(g, CX - 134, FLOOR + 4, 56, '#3fbf7f');
    seaweed(g, CX + 140, FLOOR + 4, 70, '#2f9e6a');
    coral(g, CX - 100, FLOOR + 4, '#ff7a8a');
    coral(g, CX + 104, FLOOR + 4, '#ff9a5a');
    g.fillStyle = '#7a4a2a';
    g.fillRect(CX - 26, FLOOR - 22, 52, 24);
    g.beginPath();
    g.ellipse(CX, FLOOR - 22, 26, 12, 0, Math.PI, 0);
    g.fill();
    g.fillStyle = '#e0b04a';
    g.fillRect(CX - 28, FLOOR - 14, 56, 4);
    g.fillRect(CX - 3, FLOOR - 24, 6, 14);
    groundFill(g, '#f6e6b0', '#c9a96a', 3);
    star(g, CX + 40, FLOOR + 14, 11, '#ff8f6b');
    star(g, CX - 60, FLOOR + 26, 8, '#ffb36b');
    g.restore();
    paintBase(g);
  }

  const painters = { spring: paintSpring, summer: paintSummer, autumn: paintAutumn, winter: paintWinter };

  function paintFront(g) {
    g.save();
    g.beginPath();
    g.rect(0, 0, W, LIP);
    g.clip();
    const sheen = g.createRadialGradient(CX - 40, CY - 60, R * 0.55, CX, CY, R);
    sheen.addColorStop(0, 'rgba(255,255,255,0)');
    sheen.addColorStop(0.85, 'rgba(255,255,255,.07)');
    sheen.addColorStop(1, 'rgba(255,255,255,.2)');
    g.fillStyle = sheen;
    g.beginPath();
    g.arc(CX, CY, R, 0, Math.PI * 2);
    g.fill();
    g.strokeStyle = 'rgba(255,255,255,.4)';
    g.lineWidth = 3;
    g.beginPath();
    g.arc(CX, CY, R - 1.5, 0, Math.PI * 2);
    g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.5)';
    g.lineWidth = 7;
    g.lineCap = 'round';
    g.beginPath();
    g.arc(CX, CY, R - 16, Math.PI * 1.08, Math.PI * 1.36);
    g.stroke();
    g.lineWidth = 4;
    g.beginPath();
    g.arc(CX, CY, R - 16, Math.PI * 1.43, Math.PI * 1.48);
    g.stroke();
    g.restore();
  }

  function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = canvas.clientWidth || 300;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(w * dpr * H / W);
    scale = canvas.width / W;
    backLayer = makeLayer(painters[season]);
    frontLayer = makeLayer(paintFront);
  }

  const flakes = [];
  function randomInside() {
    for (;;) {
      const a = Math.random() * Math.PI * 2, d = Math.sqrt(Math.random()) * (R - 12);
      const x = CX + Math.cos(a) * d, y = CY + Math.sin(a) * d;
      if (y < FLOOR - 8) return [x, y];
    }
  }
  function spawnTop() {
    for (;;) {
      const x = CX + (Math.random() * 2 - 1) * R, y = CY - R + 14 + Math.random() * R * 0.55;
      if (Math.hypot(x - CX, y - CY) < R - 14) return [x, y];
    }
  }
  function addFlake(x, y) {
    const r = 1.1 + Math.random() * 2.1;
    flakes.push({ x, y, vx: 0, vy: 0, r, ph: Math.random() * 20, fx: 0.5 + Math.random() * 0.9, fy: 0.6 + Math.random() * 0.8, k: 2.8 - (r - 1.1) / 2.1, stir: 0, sd: 0.22 + Math.random() * 0.2, lift: Math.random(), c: (Math.random() * 4) | 0, shape: Math.random() < 0.5 ? 0 : 1, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 5, grow: 1 });
  }
  function setCount(n, fromTop) {
    while (flakes.length < n) addFlake(...(fromTop ? spawnTop() : randomInside()));
    flakes.length = n;
  }
  setCount(COUNT, false);

  const amountEl = document.getElementById('amount');
  const amountOut = document.getElementById('amountOut');
  amountEl.max = COUNT_MAX;
  amountEl.value = COUNT;
  amountOut.textContent = COUNT;
  amountEl.addEventListener('input', () => {
    const n = Number(amountEl.value);
    amountOut.textContent = n;
    setCount(n, true);
  });

  const fluff = { g: 1, sw: 1, k: 1, sd: 1 };
  const fluffEl = document.getElementById('fluff');
  const fluffOut = document.getElementById('fluffOut');
  function setFluff(f) {
    const u = (f - FLUFF_BASE) / 60;
    fluff.g = 2 ** (-1.2 * u);
    fluff.sw = 2 ** (1.2 * u);
    fluff.k = 2 ** (-0.8 * u);
    fluff.sd = 2 ** (-1.2 * u);
    fluffOut.textContent = f;
  }
  fluffEl.value = FLUFF_DEFAULT;
  setFluff(FLUFF_DEFAULT);
  fluffEl.addEventListener('input', () => setFluff(Number(fluffEl.value)));

  function respawnLow(p) {
    const gl = Math.hypot(gx, gy) || 1, ux = gx / gl, uy = gy / gl;
    let [x, y] = randomInside();
    for (let i = 0; i < 80; i++) {
      const nx = x + ux * 5, ny = y + uy * 5;
      if (Math.hypot(nx - CX, ny - CY) > R - GLASS - p.r - 6 || ny > FLOOR - p.r - 3) break;
      x = nx;
      y = ny;
    }
    p.x = x;
    p.y = y;
    p.vx = 0;
    p.vy = 0;
    p.grow = 0;
  }

  const seasonBtns = document.querySelectorAll('.seasons button');
  const amountLabel = document.getElementById('amountLabel');
  function setSeason(name) {
    season = name;
    S = SEASONS[name];
    seasonBtns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.season === name)));
    amountLabel.textContent = S.label;
    if (backLayer) backLayer = makeLayer(painters[season]);
  }
  seasonBtns.forEach((b) => b.addEventListener('click', () => setSeason(b.dataset.season)));

  function shake(strength) {
    for (const p of flakes) {
      p.stir = Math.min(1, p.stir + strength / 400);
      p.vx += (Math.random() - 0.5) * 2 * strength;
      p.vy += (Math.random() - 0.5) * 2 * strength - strength * 0.6 * Math.random();
    }
  }

  let tgx = 0, tgy = 1, gx = 0, gy = 1;
  let gyroActive = false;

  function step(dt, t) {
    const k = Math.min(1, dt * 6);
    gx += (tgx - gx) * k;
    gy += (tgy - gy) * k;
    const sg = S.buoyant ? -1 : 1, gl = Math.hypot(gx, gy) || 1;
    for (const p of flakes) {
      const s = p.stir;
      const g = GRAVITY * fluff.g * S.gm * (1 - 0.75 * s), sw = SWAY * fluff.sw * S.sm * (1 + 1.5 * s);
      p.vx += (sg * gx * g + Math.sin(t * p.fx + p.ph) * sw) * dt;
      p.vy += (sg * gy * g + Math.cos(t * p.fy + p.ph * 1.3) * sw * 0.6) * dt;
      if (s > 0) p.stir = Math.max(0, s - p.sd * fluff.sd * dt);
      const damp = Math.exp(-p.k * fluff.k * (1 - 0.6 * s) * dt);
      p.vx *= damp;
      p.vy *= damp;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      let touched = false;
      for (let i = 0; i < 2; i++) {
        const rw = R - GLASS - p.r - p.lift * PILE;
        const dx = p.x - CX, dy = p.y - CY, d = Math.hypot(dx, dy);
        if (d > rw) {
          const nx = dx / d, ny = dy / d;
          if (S.buoyant && -(nx * gx + ny * gy) / gl > 0.4) { respawnLow(p); break; }
          p.x = CX + nx * rw;
          p.y = CY + ny * rw;
          const vn = p.vx * nx + p.vy * ny;
          if (vn > 0) { p.vx -= 1.3 * vn * nx; p.vy -= 1.3 * vn * ny; }
          touched = true;
        }
        const fy = FLOOR - p.r - p.lift * PILE;
        if (p.y > fy) {
          if (S.buoyant && -gy / gl > 0.4) { respawnLow(p); break; }
          p.y = fy;
          if (p.vy > 0) p.vy *= -0.2;
          p.vx *= 0.9;
          touched = true;
        }
      }
      if (p.grow < 1) p.grow = Math.min(1, p.grow + dt * 1.5);
      if (S.kind === 'petal' || S.kind === 'leaf') p.rot += p.vr * dt * Math.min(1, Math.hypot(p.vx, p.vy) / 20);
      if (touched) {
        p.vx += (Math.random() - 0.5) * dt * 360;
        p.vy += (Math.random() - 0.5) * dt * 360;
      }
    }
  }

  function drawRays(t) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(CX, CY, R - 1, 0, Math.PI * 2);
    ctx.clip();
    for (let i = 0; i < 5; i++) {
      const x0 = CX - 150 + i * 75 + Math.sin(t * 0.3 + i) * 10;
      ctx.fillStyle = `rgba(255,255,255,${0.05 + 0.04 * Math.sin(t * 0.7 + i * 1.7)})`;
      ctx.beginPath();
      ctx.moveTo(x0, CY - R);
      ctx.lineTo(x0 + 34, CY - R);
      ctx.lineTo(x0 - 36, FLOOR);
      ctx.lineTo(x0 - 70, FLOOR);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawFlutter(t) {
    for (let c = 0; c < 4; c++) {
      ctx.beginPath();
      for (const p of flakes) {
        if (p.c !== c) continue;
        const sz = p.r * S.size * scale;
        const flip = 0.25 + 0.75 * Math.abs(Math.cos(t * p.fy * 1.5 + p.ph));
        const co = Math.cos(p.rot) * sz, si = Math.sin(p.rot) * sz;
        ctx.setTransform(co, si, -si * flip, co * flip, p.x * scale, p.y * scale);
        if (S.kind === 'petal') {
          ctx.moveTo(0, -1);
          ctx.bezierCurveTo(0.6, -0.6, 0.6, 0.5, 0, 1);
          ctx.bezierCurveTo(-0.6, 0.5, -0.6, -0.6, 0, -1);
        } else if (p.shape === 0) {
          for (let i = 0; i < 10; i++) {
            const a = -Math.PI / 2 + i * Math.PI / 5, d = i % 2 ? 0.45 : 1;
            if (i) ctx.lineTo(Math.cos(a) * d, Math.sin(a) * d);
            else ctx.moveTo(Math.cos(a) * d, Math.sin(a) * d);
          }
          ctx.closePath();
        } else {
          ctx.moveTo(0, -1);
          ctx.quadraticCurveTo(0.9, -0.2, 0, 1);
          ctx.quadraticCurveTo(-0.9, -0.2, 0, -1);
        }
      }
      ctx.fillStyle = S.pal[c];
      ctx.fill();
    }
  }

  function drawBubbles() {
    ctx.beginPath();
    for (const p of flakes) {
      const r = p.r * S.size * p.grow;
      ctx.moveTo(p.x + r, p.y);
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    }
    ctx.fillStyle = 'rgba(255,255,255,.14)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.75)';
    ctx.lineWidth = 0.9;
    ctx.stroke();
    ctx.beginPath();
    for (const p of flakes) {
      const r = p.r * S.size * p.grow;
      ctx.moveTo(p.x - r * 0.35 + r * 0.22, p.y - r * 0.35);
      ctx.arc(p.x - r * 0.35, p.y - r * 0.35, r * 0.22, 0, Math.PI * 2);
    }
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.fill();
  }

  function drawSnow() {
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath();
    for (const p of flakes) {
      ctx.moveTo(p.x + p.r, p.y);
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    }
    ctx.fill();
  }

  function draw(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(backLayer, 0, 0);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (season === 'summer') drawRays(t);
    if (S.kind === 'bubble') drawBubbles();
    else if (S.kind === 'snow') drawSnow();
    else drawFlutter(t);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(frontLayer, 0, 0);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    step(dt, now / 1000);
    draw(now / 1000);
    requestAnimationFrame(frame);
  }

  function setStatus(text) { statusEl.textContent = text; }

  function onOrient(e) {
    if (e.beta == null || e.gamma == null) return;
    if (!gyroActive) { gyroActive = true; setStatus('ジャイロ: 使用中'); enableBtn.hidden = true; }
    const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
    let x = Math.cos(b) * Math.sin(g);
    let y = Math.sin(b) + 0.12;
    const ang = ((screen.orientation && screen.orientation.angle) || window.orientation || 0);
    const a = ((ang % 360) + 360) % 360;
    if (a === 90) [x, y] = [y, -x];
    else if (a === 180) [x, y] = [-x, -y];
    else if (a === 270) [x, y] = [-y, x];
    const m = Math.hypot(x, y) || 1;
    const s = Math.min(1, m) / m;
    tgx = x * s;
    tgy = y * s;
  }

  let lastMag = null, lastShake = 0;
  function onMotion(e) {
    const a = e.acceleration;
    let mag;
    if (a && a.x != null) {
      mag = Math.hypot(a.x, a.y, a.z);
    } else {
      const g = e.accelerationIncludingGravity;
      if (!g || g.x == null) return;
      const m = Math.hypot(g.x, g.y, g.z);
      mag = lastMag == null ? 0 : Math.abs(m - lastMag);
      lastMag = m;
    }
    if (mag > 7) {
      const now = performance.now();
      if (now - lastShake > 60) {
        lastShake = now;
        shake(Math.min((mag - 7) * 45 + 150, 700));
      }
    }
  }

  let listening = false;
  function listen() {
    if (listening) return;
    listening = true;
    window.addEventListener('deviceorientation', onOrient);
    window.addEventListener('devicemotion', onMotion);
    setTimeout(() => {
      if (!gyroActive) setStatus('ジャイロを検出できません。ドラッグで操作できます');
    }, 1500);
  }

  async function enableGyro() {
    const DOE = window.DeviceOrientationEvent, DME = window.DeviceMotionEvent;
    const asks = [];
    if (DOE && typeof DOE.requestPermission === 'function') asks.push(DOE.requestPermission());
    if (DME && typeof DME.requestPermission === 'function') asks.push(DME.requestPermission());
    if (asks.length) {
      try {
        const results = await Promise.all(asks);
        if (!results.every((r) => r === 'granted')) throw new Error('denied');
      } catch (err) {
        setStatus('モーションが許可されていません。ドラッグで操作できます');
        return;
      }
    }
    setStatus('ジャイロ: 確認中…');
    listen();
  }

  const needsPermission = window.DeviceOrientationEvent && typeof window.DeviceOrientationEvent.requestPermission === 'function';
  if (needsPermission) {
    enableBtn.hidden = false;
    setStatus('「ジャイロを使う」を押すと、傾きで動きます');
  } else if (window.DeviceOrientationEvent) {
    enableGyro();
  } else {
    setStatus('ジャイロ非対応です。ドラッグで操作できます');
  }
  enableBtn.addEventListener('click', enableGyro);
  shakeBtn.addEventListener('click', () => shake(500));
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); shake(500); }
  });

  let drag = null;
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    drag = { x: e.clientX, y: e.clientY, t: performance.now() };
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const now = performance.now();
    const dt = Math.max((now - drag.t) / 1000, 0.008);
    const f = W / canvas.clientWidth;
    const vx = (e.clientX - drag.x) * f / dt, vy = (e.clientY - drag.y) * f / dt;
    drag = { x: e.clientX, y: e.clientY, t: now };
    const speed = Math.hypot(vx, vy);
    if (speed < 120) return;
    const cx = Math.max(-700, Math.min(700, vx)), cy = Math.max(-700, Math.min(700, vy));
    for (const p of flakes) {
      const w = 0.15 + Math.random() * 0.35;
      p.vx += cx * w;
      p.vy += cy * w;
    }
    shake(Math.min(speed * 0.12, 220));
  });
  const endDrag = () => { drag = null; };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fit, 100);
  });

  setSeason(season);
  fit();
  requestAnimationFrame((now) => { last = now; frame(now); });
})();
</script>
</body>
</html>
