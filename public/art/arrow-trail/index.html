<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>やじるしコンバット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050a12;
    --ink: #e6f3ff;
    --muted: #8fa6bf;
    --cyan: #5cd6ff;
    --amber: #ffb347;
    --line: rgba(130, 190, 230, 0.22);
    --panel: rgba(8, 16, 28, 0.76);
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    font-size: 14px;
    overflow: hidden;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  canvas:active { cursor: grabbing; }

  .title {
    position: fixed;
    left: calc(18px + env(safe-area-inset-left, 0px));
    top: calc(16px + env(safe-area-inset-top, 0px));
    pointer-events: none;
  }
  .title h1 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 500;
    letter-spacing: 0.08em;
  }
  .title p {
    margin: 4px 0 0;
    font-size: 0.78rem;
    color: var(--muted);
    transition: opacity 1.2s ease;
  }
  .title p.gone { opacity: 0; }

  .dock {
    position: fixed;
    right: calc(14px + env(safe-area-inset-right, 0px));
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    max-width: calc(100vw - 28px);
  }
  .panel {
    width: 280px;
    max-width: 100%;
    box-sizing: border-box;
    padding: 14px 16px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .panel[hidden] { display: none; }
  .panel {
    max-height: calc(100vh - 120px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
  }
  .row[hidden], .actions[hidden], .check[hidden] { display: none; }
  .score {
    position: fixed;
    right: calc(18px + env(safe-area-inset-right, 0px));
    top: calc(16px + env(safe-area-inset-top, 0px));
    pointer-events: none;
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .score[hidden] { display: none; }
  .score .sa { color: var(--cyan); }
  .score .sb { color: var(--amber); }
  .score b { font-weight: 500; font-size: 1.25rem; margin: 0 4px; }
  .hud {
    position: fixed;
    left: calc(18px + env(safe-area-inset-left, 0px));
    top: calc(78px + env(safe-area-inset-top, 0px));
    pointer-events: none;
    font-size: 0.8rem;
    color: var(--ink);
  }
  .hud[hidden] { display: none; }
  .hud .bar { width: 150px; height: 6px; margin-top: 6px; border-radius: 3px; background: rgba(130, 190, 230, 0.22); overflow: hidden; }
  .hud .bar i { display: block; height: 100%; width: 100%; background: var(--cyan); transition: width 0.25s ease; }
  .hud .bar i.low { background: var(--amber); }
  fieldset.mode { border: 0; margin: 0 0 8px; padding: 0; }
  fieldset.mode legend { padding: 0; margin-bottom: 2px; color: var(--muted); font-size: 0.8rem; }
  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .row label { color: var(--ink); }
  .row output { color: var(--cyan); font-variant-numeric: tabular-nums; }
  .row input[type="range"] {
    grid-column: 1 / -1;
    width: 100%;
    margin: 8px 0 0;
    accent-color: var(--cyan);
  }
  .row input[type="number"] {
    width: 5.5rem;
    box-sizing: border-box;
    padding: 6px 8px;
    color: var(--cyan);
    background: rgba(8, 16, 28, 0.76);
    border: 1px solid var(--line);
    border-radius: 4px;
    font: inherit;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .check {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 32px;
    cursor: pointer;
  }
  .check input { accent-color: var(--cyan); width: 16px; height: 16px; margin: 0; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  button {
    font: inherit;
    color: var(--ink);
    background: rgba(8, 16, 28, 0.76);
    border: 1px solid var(--line);
    border-radius: 4px;
    min-height: 38px;
    padding: 0 14px;
    cursor: pointer;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .actions button { flex: 1; }
  button:hover { background: rgba(92, 214, 255, 0.14); }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }
  .fallback {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
    color: var(--muted);
  }
  .fallback[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="c" aria-label="矢印が飛び回りながら軌跡を描く3Dアニメーション"></canvas>

<header class="title">
  <h1>やじるしコンバット</h1>
  <p id="hint">ドラッグで回転、ホイールやピンチで拡大縮小</p>
</header>

<div class="score" id="score" hidden>
  <span class="sa">チームA</span><b id="scoreAn">0</b>:<b id="scoreBn">0</b><span class="sb">チームB</span>
</div>

<div class="hud" id="hud" hidden>
  <div id="hudLabel"></div>
  <div class="bar"><i id="hudBar"></i></div>
</div>

<aside class="dock">
  <section class="panel" id="panel" aria-label="表示設定">
    <fieldset class="mode">
      <legend>モード</legend>
      <label class="check"><input id="modeFree" type="radio" name="mode" value="free" checked>軌跡だけを眺める</label>
      <label class="check"><input id="modeChase" type="radio" name="mode" value="chase">追撃戦（ミサイルと回避）</label>
      <label class="check"><input id="modeDuel" type="radio" name="mode" value="duel">交戦（互いに攻撃）</label>
    </fieldset>
    <label class="check" id="followCamRow" hidden><input id="followCam" type="checkbox">追従カメラ</label>
    <label class="check" id="gunRow" hidden><input id="gun" type="checkbox" checked>機銃</label>
    <label class="check" id="aceRow" hidden><input id="ace" type="checkbox" checked>エース機</label>
    <fieldset class="mode">
      <legend>視点</legend>
      <label class="check"><input id="viewObl" type="radio" name="view" value="oblique" checked>斜め</label>
      <label class="check"><input id="viewTop" type="radio" name="view" value="top">真上</label>
      <label class="check" id="viewFpRow" hidden><input id="viewFp" type="radio" name="view" value="fp">主観</label>
    </fieldset>
    <div class="row" id="countRow">
      <label for="count">矢印の数</label><output id="countV"></output>
      <input id="count" type="range" min="1" max="32" step="1" value="8">
    </div>
    <div class="row" id="atkRow" hidden>
      <label for="nAtk" id="nAtkL">攻撃側の数</label><output id="nAtkV"></output>
      <input id="nAtk" type="range" min="0" max="16" step="1" value="4">
    </div>
    <div class="row" id="tgtRow" hidden>
      <label for="nTgt" id="nTgtL">逃げる側の数</label><output id="nTgtV"></output>
      <input id="nTgt" type="range" min="0" max="16" step="1" value="4">
    </div>
    <div class="row">
      <label for="speed">速度</label><output id="speedV"></output>
      <input id="speed" type="range" min="0.2" max="3" step="0.1" value="1">
    </div>
    <div class="row">
      <label for="len">軌跡の長さ</label><output id="lenV"></output>
      <input id="len" type="range" min="50" max="1500" step="10" value="450">
    </div>
    <div class="row">
      <label for="size">矢印の大きさ</label><output id="sizeV"></output>
      <input id="size" type="range" min="0.5" max="3" step="0.1" value="1.5">
    </div>
    <div class="row">
      <label for="area">戦闘領域の広さ</label><output id="areaV"></output>
      <input id="area" type="range" min="0.5" max="3" step="0.25" value="1">
    </div>
    <div class="row">
      <label for="seed">地形のシード</label>
      <input id="seed" type="number" min="0" max="9999" step="1" inputmode="numeric">
    </div>
    <div class="row" id="volleyRow" hidden>
      <label for="volley">一斉射の数</label><output id="volleyV"></output>
      <input id="volley" type="range" min="3" max="16" step="1" value="9">
    </div>
    <div class="row" id="hpRow" hidden>
      <label for="hp">耐久力（被弾に耐える回数）</label><output id="hpV"></output>
      <input id="hp" type="range" min="1" max="10" step="1" value="4">
    </div>
    <div class="row" id="respawnRow" hidden>
      <label for="respawn">補充までの時間</label><output id="respawnV"></output>
      <input id="respawn" type="range" min="0" max="5" step="0.5" value="0">
    </div>
    <div id="followRow" hidden>
      <fieldset class="mode">
        <legend>追従するチーム</legend>
        <label class="check"><input id="ftA" type="radio" name="followTeam" value="A"><span id="ftAL">チームA</span></label>
        <label class="check"><input id="ftB" type="radio" name="followTeam" value="B"><span id="ftBL">チームB</span></label>
        <label class="check"><input id="ftBoth" type="radio" name="followTeam" value="both" checked>両方</label>
      </fieldset>
      <div class="actions"><button id="nextTarget" type="button">次の機体</button></div>
      <label class="check"><input id="autoNext" type="checkbox">撃墜されたら自動で次の機体へ</label>
      <div class="row" id="followDelayRow" hidden>
        <label for="followDelay">切り替えまでの間隔</label><output id="followDelayV"></output>
        <input id="followDelay" type="range" min="0" max="5" step="0.5" value="2">
      </div>
    </div>
    <label class="check"><input id="auto" type="checkbox">カメラを自動で回す</label>
    <label class="check"><input id="terrain" type="checkbox" checked>地形を表示する</label>
    <div class="actions">
      <button id="reset" type="button">最初から</button>
      <button id="pause" type="button" aria-pressed="false">一時停止</button>
    </div>
  </section>
  <button id="toggle" type="button" aria-expanded="true" aria-controls="panel">設定</button>
</aside>

<div class="fallback" id="fallback" hidden>このブラウザでは3D表示（WebGL）を利用できません。</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="terrain.js"></script>
<script>
(function () {
  'use strict';

  var MAXN = 32;        // 作成する矢印の最大数
  var CAP = 1600;       // 軌跡バッファの点数
  var R0 = 125;         // 飛行範囲の半径（戦闘領域の広さ ×1.0 のとき）
  var R = R0;           // 飛行範囲の半径（「戦闘領域の広さ」で変わる）
  var STEP_MAX = 1 / 60;
  var COMMIT = 1.0;     // 軌跡に点を足す最小距離

  function $(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var state = { count: 8, speed: 1, len: 450, size: 1.5, auto: !reduceMotion, terrain: true, paused: false, volley: 9, mode: 'free', view: 'oblique', nAtk: 4, nTgt: 4, hp: 4, autoNext: false, followObj: null, followGen: 0, followCam: false, followTeam: 'B', respawn: 0, score: [0, 0], gun: true, ace: true, area: 1, seed: Math.floor(Math.random() * (Terrain.SEED_MAX + 1)), followLost: -1, followDelay: 2 };   // 地形のシードは、開くたびにランダム

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
  } catch (err) {
    $('fallback').hidden = false;
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  var BG = 0x050a12;
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(BG);
  scene.fog = new THREE.Fog(BG, 170, 520);
  var camera = new THREE.PerspectiveCamera(48, 1, 1, 2000);

  /* ---------- 地形（ワイヤーフレーム） ---------- */
  // 地形の高さ（terrain.js）。シードを変えたときは、makeHeight で作り直す
  var H = Terrain.makeHeight(state.seed);

  // 地形の線。広さと格子の間隔を倍率で変えて、頂点の数は変えない
  function buildTerrainGeometry(scale) {
    var half = 160 * scale, step = 5 * scale, n = 64;
    var pos = [], col = [];
    function vtx(x, z) {
      var h = H(x, z);
      pos.push(x, h, z);
      var d = Math.hypot(x, z) / half;
      var fall = Math.max(0, 1 - d * d);
      var k = fall * (0.35 + 0.65 * Math.min(1, h / 26));
      col.push(0.16 * k, 0.48 * k, 0.74 * k);
    }
    var i, j, z, x;
    for (i = 0; i <= n; i++) {
      z = -half + i * step;
      for (j = 0; j < n; j++) { x = -half + j * step; vtx(x, z); vtx(x + step, z); }
    }
    for (j = 0; j <= n; j++) {
      x = -half + j * step;
      for (i = 0; i < n; i++) { z = -half + i * step; vtx(x, z); vtx(x, z + step); }
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
    g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(col), 3));
    return g;
  }

  var terrain = (function () {
    var g = buildTerrainGeometry(1);
    var m = new THREE.LineBasicMaterial({
      vertexColors: true, transparent: true, opacity: 0.8,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    var mesh = new THREE.LineSegments(g, m);
    mesh.frustumCulled = false;
    return mesh;
  })();
  scene.add(terrain);

  /* ---------- 矢印と軌跡 ---------- */
  var arrowFill = new THREE.BufferGeometry();
  arrowFill.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    0, 0, 2.2,  -1.5, 0.3, -1.4,  0, 0, -0.6,
    0, 0, 2.2,  0, 0, -0.6,  1.5, 0.3, -1.4
  ]), 3));
  var arrowEdge = new THREE.BufferGeometry();
  arrowEdge.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    0, 0, 2.2,  -1.5, 0.3, -1.4,  0, 0, -0.6,  1.5, 0.3, -1.4
  ]), 3));

  // 軌跡は翼幅の帯（リボン）。各点で左右の翼端の2頂点を持ち、三角形の帯でつなぐ
  var trailMat = new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  var trailIndex = (function () {
    var idx = new Uint16Array((CAP - 1) * 6);
    for (var i = 0; i < CAP - 1; i++) {
      var v = i * 2;
      idx.set([v, v + 1, v + 2, v + 1, v + 3, v + 2], i * 6);
    }
    return idx;
  })();

  var PALETTE = [0x5cd6ff, 0xe6f3ff, 0x5cd6ff, 0xffb347];
  var air = [];

  function makeAircraft(i) {
    var a = {};
    a.color = new THREE.Color(PALETTE[i % PALETTE.length]);
    a.root = new THREE.Group();

    a.arrow = new THREE.Group();
    a.fillMat = new THREE.MeshBasicMaterial({
      color: a.color.clone(), transparent: true, opacity: 0.5, side: THREE.DoubleSide, depthWrite: false
    });
    a.edgeCol = a.color.clone().lerp(new THREE.Color(0xffffff), 0.45);
    a.edgeMat = new THREE.LineBasicMaterial({ color: a.edgeCol.clone() });
    var fill = new THREE.Mesh(arrowFill, a.fillMat);
    var edge = new THREE.LineLoop(arrowEdge, a.edgeMat);
    a.arrow.add(fill, edge);
    a.arrow.scale.setScalar(state.size);
    a.root.add(a.arrow);

    a.trailPos = new Float32Array(CAP * 6);
    a.trailCol = new Float32Array(CAP * 6);
    a.geo = new THREE.BufferGeometry();
    a.posAttr = new THREE.BufferAttribute(a.trailPos, 3);
    a.posAttr.setUsage(THREE.DynamicDrawUsage);
    a.colAttr = new THREE.BufferAttribute(a.trailCol, 3);
    a.geo.setAttribute('position', a.posAttr);
    a.geo.setAttribute('color', a.colAttr);
    a.geo.setIndex(new THREE.BufferAttribute(trailIndex, 1));
    a.geo.setDrawRange(0, 0);
    a.trailMat = trailMat.clone();      // 撃墜後に軌跡を薄れさせるため、機体ごとに持つ
    a.ribbon = new THREE.Mesh(a.geo, a.trailMat);
    a.ribbon.frustumCulled = false;
    a.root.add(a.ribbon);

    a.dropPos = new Float32Array(6);
    a.dropGeo = new THREE.BufferGeometry();
    a.dropAttr = new THREE.BufferAttribute(a.dropPos, 3);
    a.dropAttr.setUsage(THREE.DynamicDrawUsage);
    a.dropGeo.setAttribute('position', a.dropAttr);
    var drop = new THREE.Line(a.dropGeo, new THREE.LineBasicMaterial({
      color: a.color, transparent: true, opacity: 0.22, depthWrite: false
    }));
    drop.frustumCulled = false;
    a.drop = drop;
    a.root.add(drop);

    a.pos = new THREE.Vector3();
    a.last = new THREE.Vector3();
    a.fwd = new THREE.Vector3(0, 0, 1);
    a.q = new THREE.Quaternion();          // 機体の姿勢
    a.dd = new THREE.Vector3(0, 0, 1);     // パイロットが進みたい方向
    a.threatDir = new THREE.Vector3(0, 0, 1);
    a.direct = null; a.man = null;
    a.rt = new THREE.Vector3(1, 0, 0);   // ロール込みの右方向（翼の向き）
    a.upv = new THREE.Vector3(0, 1, 0);  // ロール込みの上方向
    a.role = null;
    a.tgt = null;
    a.idx = i;
    a.team = i < 16 ? 0 : 1;      // スロット 0〜15 = チームA（攻撃側）、16〜31 = チームB（逃げる側）
    a.arriving = false;           // 遠方から飛来中
    a.arrP = new THREE.Vector3(); // 飛来中に向かう戦場内の点
    a.on = false; a.dead = false; a.gen = 0;     // 使用中か・撃墜されたか・世代（補充のたびに増える）
    a.hp = 1; a.hpMax = 1; a.flash = 0; a.fade = 0; a.respawnT = 0;
    a.ace = false; a.kills = 0;
    a.count = 0;
    a.root.visible = false;
    scene.add(a.root);
    paintTrail(a);
    return a;
  }

  function paintTrail(a) {
    var L = state.len, c = a.color, col = a.trailCol, head0 = 1.2 * state.size, gain = a.ace ? ACE_TRAIL : 1;
    for (var i = 0; i < CAP; i++) {
      var age = CAP - 1 - i;
      var t = Math.max(0, 1 - age / L);
      var b = Math.pow(t, 1.6) * 0.6;
      // 機体の近くは透明にし、後ろへ向かって徐々に濃くする（矢印との重なりを避ける）
      var u = clamp((age - head0) / 6, 0, 1);
      b *= u * u * (3 - 2 * u) * gain;
      for (var k = 0; k < 2; k++) {
        var o = (i * 2 + k) * 3;
        col[o] = c.r * b;
        col[o + 1] = c.g * b;
        col[o + 2] = c.b * b;
      }
    }
    a.colAttr.needsUpdate = true;
  }

  function wave() {
    return { A: rand(0.12, 0.5), w: rand(0.15, 1.2), p: rand(0, Math.PI * 2) };
  }

  function reset(a) {
    var yaw = rand(0, Math.PI * 2);
    a.q.setFromAxisAngle(UP, yaw);
    a.pos.set(rand(-0.6 * R, 0.6 * R), rand(25, 55), rand(-0.6 * R, 0.6 * R));
    a.t = rand(0, 100);
    a.base = 30 * rand(0.85, 1.15);
    a.speed = a.base;
    a.thr = 0.5; a.thrCmd = 0.5;
    a.p = 0; a.qu = 0; a.r = 0;
    a.cp = 0; a.cq = 0; a.cr = 0;
    a.pLim = 1.3; a.nLim = 2.2; a.bankLim = 1.0;
    a.man = null; a.direct = null;
    a.manCool = rand(0.5, 2);
    a.aeroT = rand(8, 20);
    a.recover = 0; a.yoyo = 0;
    a.wYaw = yaw; a.wPit = 0;
    a.yw = [wave(), wave(), wave()];
    a.pt = [wave(), wave()];
    a.pt[0].A = rand(0.15, 0.4);
    a.pt[1].A = rand(0.08, 0.2);
    basis(a);
    var p = a.trailPos;
    for (var i = 0; i < CAP * 2; i++) {
      p[i * 3] = a.pos.x; p[i * 3 + 1] = a.pos.y; p[i * 3 + 2] = a.pos.z;
    }
    initCombat(a);
    a.count = 0;
    a.last.copy(a.pos);
    a.posAttr.needsUpdate = true;
  }

  // 左右の翼端の位置を帯の1点として書き込む（ロールは a.rt の向きに反映される）
  function writeRibbonPoint(a, o) {
    var hw = 1.2 * state.size, p = a.trailPos, rt = a.rt, pos = a.pos;
    p[o] = pos.x - rt.x * hw; p[o + 1] = pos.y - rt.y * hw; p[o + 2] = pos.z - rt.z * hw;
    p[o + 3] = pos.x + rt.x * hw; p[o + 4] = pos.y + rt.y * hw; p[o + 5] = pos.z + rt.z * hw;
  }

  function commit(a) {
    a.trailPos.copyWithin(0, 6);
    writeRibbonPoint(a, (CAP - 1) * 6);
    if (a.count < state.len) a.count++;
    a.last.copy(a.pos);
  }

  /* ---------- 飛行モデル（機体座標系） ----------
     姿勢はクォータニオン。ロール・ピッチ・ヨーの角速度を機体の軸で積分し、
     進行方向は常に機首の向き。旋回は「機体を傾けて機首を引く」ことで生まれる。
     速度は推力・抗力・重力・旋回の負荷（誘導抵抗）で決まる。 */
  var G = 12;            // 重力加速度
  var TMAX = 18;         // スロットル1.0の推力
  var CDRAG = 0.01;      // 空気抵抗
  var CIND = 0.12;       // 旋回の負荷による抵抗
  var UP = new THREE.Vector3(0, 1, 0);
  var _qi = new THREE.Quaternion(), _dq = new THREE.Quaternion();
  var _l = new THREE.Vector3(), _w = new THREE.Vector3(), _ax = new THREE.Vector3();
  var _dd = new THREE.Vector3(), _wu = new THREE.Vector3(), _hv = new THREE.Vector3();
  var _m = new THREE.Matrix4();
  var WHITE = new THREE.Color(1, 1, 1);

  function wrapPi(x) { return Math.atan2(Math.sin(x), Math.cos(x)); }
  function smooth01(e0, e1, x) { var t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }

  // 姿勢から、機首・右翼・上方向を求める
  function basis(a) {
    a.fwd.set(0, 0, 1).applyQuaternion(a.q);
    a.rt.set(1, 0, 0).applyQuaternion(a.q);
    a.upv.set(0, 1, 0).applyQuaternion(a.q);
  }
  function orient(a) { basis(a); }

  // 世界の上方向を機体座標で見たベクトル（x: 右, y: 上, z: 前）
  function worldUpInBody(a) {
    _qi.copy(a.q).invert();
    return _wu.set(0, 1, 0).applyQuaternion(_qi);
  }
  // 翼を水平に保つためのロール指令（正位置でも背面でも効く）
  function levelHold(a) {
    var u = worldUpInBody(a);
    return 2.5 * u.x * clamp(u.y * 3, -1, 1);
  }

  // 目標速度を保つオートスロットル（上昇・降下の分を先に見込む）
  function cruiseThr(a, vt) {
    return clamp((CDRAG * a.speed * a.speed + G * a.fwd.y + 2.0 * (vt - a.speed)) / TMAX, 0.08, 1);
  }

  // 進みたい方向 dd へ向かうための、ロール・ピッチ・ヨーの指令を作る
  function steer(a, dd) {
    _qi.copy(a.q).invert();
    _l.copy(dd).applyQuaternion(_qi);                       // 目標方向を機体座標で見る
    var th = Math.acos(clamp(_l.z, -1, 1));                 // 機首と目標のなす角
    var psi = Math.atan2(_l.x, _l.y);                       // 機体の上方向から見た目標の向き
    _wu.set(0, 1, 0).applyQuaternion(_qi);
    var phiCur = -Math.atan2(_wu.x, _wu.y);                 // 現在のバンク角（右が正）
    var bw = smooth01(0.015, 0.12, th);                     // 誤差が大きいほど「傾けて引く」
    var lim = a.bankLim;
    var phiTgt = bw * clamp(wrapPi(phiCur + psi), -lim, lim);
    a.cp = 3.2 * wrapPi(phiTgt - phiCur);
    // 目標が揚力の向きの側にあれば引く。反対側なら（傾きの上限でそこまで傾けられないとき）軽く押し下げる
    var cs = Math.cos(psi);
    a.cq = bw * 2.8 * th * (cs >= 0 ? cs : 0.35 * cs) + (1 - bw) * 3.0 * _l.y;
    a.cr = (1 - 0.6 * bw) * 1.5 * _l.x;
  }

  function resyncWander(a) {
    a.wYaw = Math.atan2(a.fwd.x, a.fwd.z);
    a.wPit = clamp(Math.asin(clamp(a.fwd.y, -1, 1)), -0.4, 0.4);
  }

  // 通常飛行: ゆるやかに進路を変え、高さを保つ
  function cruise(a) {
    var k, w, yr = 0, pt = 0;
    for (k = 0; k < a.yw.length; k++) { w = a.yw[k]; yr += w.A * Math.sin(w.w * a.t + w.p); }
    for (k = 0; k < a.pt.length; k++) { w = a.pt[k]; pt += w.A * Math.sin(w.w * a.t + w.p); }
    a.wYaw += yr * 0.5 * cruise.dt;
    var x = a.pos.x, z = a.pos.z, y = a.pos.y;
    var g = Math.max(H(x, z), H(x + a.fwd.x * 28, z + a.fwd.z * 28));
    var lo = g + 18, hi = Math.min(g + 62, 85);
    if (y < lo) pt += Math.min(0.6, (lo - y) * 0.05);
    else if (y > hi) pt -= Math.min(0.5, (y - hi) * 0.04);
    a.wPit = clamp(pt, -0.35, 0.5);
    var cp = Math.cos(a.wPit);
    a.dd.set(Math.sin(a.wYaw) * cp, Math.sin(a.wPit), Math.cos(a.wYaw) * cp);
  }
  cruise.dt = 0.016;

  // 攻撃側: 標的を先読みして追う。近づきすぎたら上昇して距離を取る
  var EXT_NEAR = 1.0, EXT_BACK = 1.6, EXT_MAX = 3;   // 離れ始める距離・戻る距離（ミサイルの最短距離に対する倍率）、離れる最長の秒数

  function pursuit(a, dt) {
    var T = a.tgt;
    _hv.subVectors(T.pos, a.pos);
    var dist = _hv.length() || 1;
    a.dist = dist;
    a.aim = Math.acos(clamp(a.fwd.dot(_hv) / dist, -1, 1));
    _dd.copy(_hv).addScaledVector(T.fwd, T.speed * clamp(dist / (a.speed + 40), 0, 1.5) * 0.7).normalize();
    // 機銃: 近づいたら、弾が当たる先読み点へ機首を向ける
    a.gunD = dist; a.gunErr = 3;
    if (state.gun) {
      gunSolution(a, T);
      a.gunErr = Math.acos(clamp(a.fwd.dot(_gv), -1, 1));
      if (dist < GUN_RANGE * 1.3) _dd.copy(_gv);
    }
    a.pLim = 3.0; a.nLim = 4.0; a.bankLim = 1.6;
    // 位置取り: ミサイルが撃てる状態（機銃オフなら常に）は、ミサイルの発射距離に合う帯を保つ
    var K = MISSILE[a.mKind], near = K.rMin * EXT_NEAR, far = K.rMax * 0.85;
    var band = a.fireT <= 0 && a.salvoLeft <= 0 || !state.gun;
    if (band && a.extend <= 0 && dist < near) a.extend = EXT_MAX;     // 近すぎたら、いったん離れる
    if (a.extend > 0) {
      a.extend -= dt;
      if (!band || dist >= K.rMin * EXT_BACK) a.extend = 0;           // 十分離れたら、機首を標的へ戻す
    }
    if (a.extend > 0) {
      _dd.copy(_hv).multiplyScalar(-1 / dist).addScaledVector(UP, 0.25).normalize();
      a.thrCmd = 1.3;
      a.dd.copy(_dd);
      return;
    }
    if (dist < (state.gun ? 20 : 32)) a.yoyo = 1.2;
    if (a.yoyo > 0) {
      a.yoyo -= dt;
      _dd.copy(a.fwd).multiplyScalar(0.5).addScaledVector(UP, 0.9).normalize();
      a.thrCmd = a.speed > 26 ? 0.1 : 0.6;
    } else if (dist > (band ? Math.min(100, far) : 100)) a.thrCmd = 1.3;
    else a.thrCmd = cruiseThr(a, T.speed * 1.08);
    a.dd.copy(_dd);
  }

  function pickWeighted(opts) {
    var tot = 0, i;
    for (i = 0; i < opts.length; i++) tot += opts[i][1];
    var r = Math.random() * tot;
    for (i = 0; i < opts.length; i++) { r -= opts[i][1]; if (r <= 0) return opts[i][0]; }
    return opts[0][0];
  }
  function newMan(type, thr) {
    return { type: type, t: 0, side: Math.random() < 0.5 ? -1 : 1, vert: Math.random() < 0.5 ? -1 : 1,
             phase: 0, roll: 0, ang: 0, minY: 0, thr: thr };
  }

  // 標的側の回避: ブレイク・切り返し・バレルロール・スプリットSから選ぶ
  function startEvade(a) {
    var alt = a.pos.y - H(a.pos.x, a.pos.z);
    var inside = Math.hypot(a.pos.x, a.pos.z) < R * 0.65 && a.pos.y < 100;
    var rolled = a.lastType === 'barrel' || a.lastType === 'splits';   // ロール系が続くと目が回るので間を空ける
    var opts = [['break', 3], ['jink', 2]];
    if (alt > 22 && inside) opts.push(['barrel', rolled ? 0.3 : 2]);
    if (alt > 55 && a.speed > 26 && inside) opts.push(['splits', rolled ? 0.3 : 2]);
    var type = pickWeighted(opts);
    a.man = newMan(type, Math.random() < 0.5 ? 0.12 : 1.3);
    a.lastType = type;
  }

  // 通常飛行の見せ場: 宙返り・インメルマンターン・バレルロール
  function startAero(a) {
    a.aeroT = rand(14, 28);
    if (Math.hypot(a.pos.x, a.pos.z) > R * 0.6) { a.aeroT = 3; return; }   // 外側では始めない
    var alt = a.pos.y - H(a.pos.x, a.pos.z);
    var opts = [['barrel', 2]];
    if (alt > 16 && a.pos.y < 90 && Math.hypot(a.pos.x, a.pos.z) < 0.55 * R) {
      opts.push(['loop', 4]); opts.push(['immel', 3]);
    }
    var type = pickWeighted(opts);
    a.man = newMan(type, 1.0);
  }

  function runManeuver(a, dt) {
    var m = a.man, done = false;
    m.t += dt;
    switch (m.type) {
      case 'break':
        // ミサイルの視線に対して横向きに急旋回する
        a.pLim = 3.6; a.nLim = 4.6; a.bankLim = 1.7; a.thrCmd = m.thr;
        _hv.crossVectors(UP, a.threatDir);
        if (_hv.lengthSq() < 1e-4) _hv.set(1, 0, 0);
        _hv.normalize().multiplyScalar(m.side);
        a.dd.copy(_hv).multiplyScalar(0.9).addScaledVector(UP, 0.35 * m.vert).normalize();
        if (m.t > 1.7) done = true;
        break;
      case 'jink':
        // 左右に切り返す
        a.pLim = 2.8; a.nLim = 3.4; a.bankLim = 1.4; a.thrCmd = 1.0;
        _hv.copy(a.fwd); _hv.y = 0;
        if (_hv.lengthSq() < 1e-4) _hv.set(0, 0, 1);
        _hv.normalize();
        var sd = (Math.floor(m.t / 0.7) % 2 ? -1 : 1) * m.side;
        _wu.crossVectors(UP, _hv);
        a.dd.copy(_hv).addScaledVector(_wu, 0.9 * sd);
        a.dd.y += 0.15 * Math.sin(m.t * 5);
        a.dd.normalize();
        if (m.t > 2.2) done = true;
        break;
      case 'barrel':
        // ロールしながら引く（らせん軌道）。1回転したら終わり
        a.pLim = 3.2; a.nLim = 3.0; a.thrCmd = m.thr;
        var ev = a.role === 'tgt' || a.role === 'duel';
        a.direct = { p: m.side * (ev ? 3.0 : 2.2), q: ev ? 0.9 : 0.7, r: 0 };
        m.roll += Math.abs(a.p) * dt;
        if (m.roll > 6.28 || m.t > 3.8) done = true;
        break;
      case 'splits':
        // 背面にロールして、そのまま引いて急降下し、進路を反転する
        a.pLim = 3.4; a.nLim = 5.0; a.thrCmd = 1.3;
        if (m.phase === 0) {
          a.direct = { p: m.side * 3.2, q: 0, r: 0 };
          if (worldUpInBody(a).y < -0.75 || m.t > 1.2) m.phase = 1;
        }
        if (m.phase === 1) {
          a.direct = { p: levelHold(a), q: 3.0, r: 0 };
          m.minY = Math.min(m.minY, a.fwd.y);
          if ((m.minY < -0.8 && a.fwd.y > -0.15) || m.t > 5) done = true;
        }
        break;
      case 'loop':
        a.pLim = 3.0; a.nLim = 6.0; a.thrCmd = 1.3;
        if (m.phase === 0) {      // 速度をつけてから引く
          a.dd.copy(a.fwd); a.dd.y = 0;
          if (a.dd.lengthSq() < 1e-4) a.dd.set(0, 0, 1);
          a.dd.normalize();
          if (a.speed >= 36 || m.t > 3) m.phase = 1;
        }
        if (m.phase === 1) {
          a.direct = { p: levelHold(a), q: 1.3, r: 0 };
          m.ang += a.qu * dt;
          if (m.ang > 6.0 || m.t > 9) done = true;
        }
        break;
      case 'immel':
        a.pLim = 3.0; a.nLim = 6.0; a.thrCmd = 1.3;
        if (m.phase === 0) {
          a.dd.copy(a.fwd); a.dd.y = 0;
          if (a.dd.lengthSq() < 1e-4) a.dd.set(0, 0, 1);
          a.dd.normalize();
          if (a.speed >= 36 || m.t > 3) m.phase = 1;
        }
        if (m.phase === 1) {
          a.direct = { p: levelHold(a), q: 1.4, r: 0 };
          m.ang += a.qu * dt;
          if (m.ang > 2.9) m.phase = 2;
        }
        if (m.phase === 2) {      // 背面のままロールして正位置に戻る
          a.direct = { p: m.side * 3.0, q: 0.1, r: 0 };
          if (worldUpInBody(a).y > 0.9 || m.t > 9) done = true;
        }
        break;
      default:
        done = true;
    }
    if (done) {
      a.man = null;
      a.direct = null;
      a.manCool = (a.role === 'tgt' || a.role === 'duel') ? rand(0.15, 0.5) : 0;
      resyncWander(a);
    }
  }

  // 地面・範囲外を避ける（最優先）
  function safety(a, dt) {
    var x = a.pos.x, z = a.pos.z, y = a.pos.y;
    var L = clamp(a.speed, 24, 60);
    var g = Math.max(H(x, z), H(x + a.fwd.x * L, z + a.fwd.z * L), H(x + a.fwd.x * L * 0.5, z + a.fwd.z * L * 0.5));
    var sink = Math.max(0, -a.fwd.y) * a.speed;
    if (y - g < 14 + sink * 1.4) {
      if (a.recover <= 0) { a.man = null; a.direct = null; }
      a.recover = 0.8;
    }
    if (a.recover > 0) {
      a.recover -= dt;
      a.direct = null;
      _hv.copy(a.fwd); _hv.y = 0;
      if (_hv.lengthSq() < 1e-4) _hv.set(Math.sin(a.wYaw), 0, Math.cos(a.wYaw));
      _hv.normalize();
      a.dd.copy(_hv).multiplyScalar(0.45).addScaledVector(UP, 0.9).normalize();
      a.pLim = 3.4; a.nLim = 5.5; a.bankLim = 2.2; a.thrCmd = 1.2;
      return;
    }
    var d = Math.hypot(x, z);
    if (a.speed < 17 && a.man) { a.man = null; a.direct = null; a.manCool = Math.max(a.manCool, 0.8); }
    if (d > R * 1.2 || y > 135) {   // 遠く離れすぎ・高すぎたら機動を打ち切って戻る
      a.man = null; a.direct = null;
      a.manCool = Math.max(a.manCool, 1.2);
      a.aeroT = Math.max(a.aeroT, 4);
    }
    if (!a.direct && d > R * 0.6) {
      // 進みたい向きを、中心へ戻る向きへ寄せる（向きの角度で混ぜる。ベクトルで混ぜると打ち消し合うため）
      var k = clamp((d - R * 0.6) / (R * 0.35), 0, 1);
      if (d > R * 1.2) k = 1;
      var yD = Math.atan2(a.dd.x, a.dd.z), yC = Math.atan2(-x, -z);
      var ny = yD + wrapPi(yC - yD) * k;
      var pitD = Math.asin(clamp(a.dd.y, -1, 1)) * (1 - 0.5 * k) + 0.5 * k * clamp((40 - y) * 0.01, -0.3, 0.3);
      var cpd = Math.cos(pitD);
      a.dd.set(Math.sin(ny) * cpd, Math.sin(pitD), Math.cos(ny) * cpd);
      a.bankLim = Math.max(a.bankLim, 1.5 * k);
      a.pLim = Math.max(a.pLim, 2.4 * k);
      a.nLim = Math.max(a.nLim, 4.5 * k);
      a.wYaw += wrapPi(Math.atan2(a.fwd.x, a.fwd.z) - a.wYaw) * Math.min(1, 2 * dt) * k;
    }
    if (!a.direct) {
      // 高すぎたら降下する
      var kc = clamp((y - 100) / 35, 0, 1);
      if (kc > 0) {
        var pc = Math.asin(clamp(a.dd.y, -1, 1)) * (1 - kc) - 0.4 * kc;
        var hl = Math.hypot(a.dd.x, a.dd.z) || 1;
        var cpc = Math.cos(pc);
        a.dd.set(a.dd.x / hl * cpc, Math.sin(pc), a.dd.z / hl * cpc);
      }
      // 低速すぎたら加速して機首を下げる（失速の防止）
      if (a.speed < 18) {
        a.thrCmd = Math.max(a.thrCmd, 1.3);
        a.dd.y = Math.min(a.dd.y, -0.25);
        a.dd.normalize();
      }
    }
  }

  // その時点の状況から、進みたい方向・操縦の限界・スロットルを決める
  function decide(a, dt) {
    a.direct = null;
    a.pLim = 1.3; a.nLim = 2.2; a.bankLim = 1.0;
    a.thrCmd = cruiseThr(a, a.base);
    a.manCool -= dt;
    cruise.dt = dt;
    if (a.arriving) {
      // 補充機: 遠方から戦場へ向けて、まっすぐ高速で飛んでくる
      if (Math.hypot(a.pos.x, a.pos.z) < R * 0.95) { a.arriving = false; resyncWander(a); }
      else {
        a.man = null; a.direct = null; a.recover = 0;
        a.dd.subVectors(a.arrP, a.pos).normalize();
        a.pLim = 1.6; a.nLim = 2.5; a.bankLim = 1.2;
        a.thrCmd = 1.3;
        a.speed = Math.max(a.speed, 70);
        return;
      }
    }
    var role = a.role;
    if (!a.man) {
      if (role === 'tgt' || role === 'duel') {
        if ((a.threat < 95 || a.gunThreat < 110) && a.manCool <= 0 && a.recover <= 0) startEvade(a);
      } else if (!role) {
        a.aeroT -= dt;
        if (a.aeroT <= 0 && a.recover <= 0) startAero(a);
      }
    }
    if (a.man) runManeuver(a, dt);
    if (!a.man) {
      if ((role === 'atk' || role === 'duel') && a.tgt) pursuit(a, dt);
      else cruise(a);
    }
    safety(a, dt);
  }

  // 指令 → ロール・ピッチ・ヨーの角速度（上限と応答の遅れつき）
  function controls(a, dt) {
    var auth = clamp((a.speed - 8) / 12, 0.25, 1);               // 低速では舵が効きにくい
    var turn = a.ace ? ACE_TURN : 1;
    var qMax = Math.min(2.4, a.nLim * G / Math.max(a.speed, 12)) * auth * turn;   // Gの上限
    var pMax = a.pLim * auth * turn;
    var cp, cq, cr;
    if (a.direct) { cp = a.direct.p; cq = a.direct.q; cr = a.direct.r; }
    else { steer(a, a.dd); cp = a.cp; cq = a.cq; cr = a.cr; }
    a.p += (clamp(cp, -pMax, pMax) - a.p) * Math.min(1, 7 * dt);
    a.qu += (clamp(cq, -qMax * 0.4, qMax) - a.qu) * Math.min(1, 5 * dt);
    a.r += (clamp(cr, -0.5, 0.5) - a.r) * Math.min(1, 4 * dt);
  }

  function integrate(a, dt) {
    // 機体の軸まわりに回転: ピッチ上げは -x、右ロールは -z、右ヨーは +y
    _w.set(-a.qu, a.r, -a.p);
    var ang = _w.length() * dt;
    if (ang > 1e-9) {
      _ax.copy(_w).normalize();
      _dq.setFromAxisAngle(_ax, ang);
      a.q.multiply(_dq).normalize();
    }
    basis(a);
    // 速度: 推力 - 抗力 - 旋回の負荷 - 重力（上昇で減速、降下で加速）
    a.thr += (a.thrCmd - a.thr) * Math.min(1, 2.5 * dt);
    var n = Math.max(1, Math.abs(a.qu) * a.speed / G);
    var acc = a.thr * TMAX - CDRAG * a.speed * a.speed - CIND * (n * n - 1) - G * a.fwd.y;
    a.speed = clamp(a.speed + acc * dt, 9, 75);
    a.pos.addScaledVector(a.fwd, a.speed * dt);
    a.pos.y = Math.max(a.pos.y, H(a.pos.x, a.pos.z) + 3);
    if (a.pos.distanceToSquared(a.last) > COMMIT * COMMIT) { orient(a); commit(a); }
  }

          } else if (a.fireT <= 0 && !a.man && a.dist < MISSILE[a.mKind].rMax && a.dist > MISSILE[a.mKind].rMin && a.aim < 0.5) {
            a.salvoLeft = MISSILE[a.mKind].salvo || state.volley + (a.ace ? ACE_SALVO : 0);
            a.salvoT = 0;
          }
          if (state.gun && !a.man) {
            gunControl(a, h);
            // 後ろから機銃で狙われている相手に知らせる（正面から向かい合っているときは回避しない）
            if (a.gunD < 120 && a.gunErr < 0.3) {
              var v = a.tgt;
              _hv.subVectors(v.pos, a.pos).normalize();
              if (_hv.dot(v.fwd) > 0.3 && a.gunD < v.gunThreat) {
                v.gunThreat = a.gunD;
                if (v.threat > 1e8) v.threatDir.copy(_hv).negate();
              }
            }
          }
        }
      }
      if (a.role === 'tgt' || a.role === 'duel') {
        a.flareT -= h;
        if (a.flareLeft > 0) {
          a.flareGap -= h;
          if (a.flareGap <= 0) { spawnFlare(a); a.flareLeft--; a.flareGap = 0.09; }
        } else if (a.flareT <= 0 && a.threat < 100 && MISSILE[a.threatKind].decoy === 'flare') {
          a.flareLeft = 6; a.flareGap = 0; a.flareT = 2.2;

        a.chaffT -= h;
        if (a.chaffLeft > 0) {
          a.chaffGap -= h;

          a.chaffLeft = 6; a.chaffGap = 0; a.chaffT = 2.2;
        }
      }
    }
    for (i = 0; i < MAXG; i++) stepGhost(GHOSTS[i], h);
    for (i = 0; i < MAXM; i++) stepMissile(missiles[i], h);
    for (i = 0; i < MAXF; i++) { stepFlare(flares[i], h); stepChaff(chaffs[i], h); }
    stepBullets(h);
  }

  /* ---------- カメラ ---------- */
  var cam = { yaw: 0.6, pitch: 0.38, pitchOb: 0.38, dist: 260, target: new THREE.Vector3(0, 26, 0) };

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;

  // 主観視点: 追っている機体の機首から前を見る。ドラッグで見回し、離すと前向きに戻る
  var look = { yaw: 0, pitch: 0 };
  var FP_FOV = 70, DEFAULT_FOV = 48, LOOK_YAW = 2.09, LOOK_PITCH = 1.05;
  var _fpE = new THREE.Euler(0, 0, 0, 'YXZ'), _fpQ = new THREE.Quaternion();

  function setFov(fov) {
    if (Math.abs(camera.fov - fov) < 0.01) return;

    camera.updateProjectionMatrix();
  }

  function updateFirstPerson(dt) {
    setFov(FP_FOV);
    scene.fog.near = 150; scene.fog.far = 520;
    if (!followValid()) return;                    // 撃墜されたら、その場で止まる
    var a = state.followObj;
    camera.position.copy(a.pos).addScaledVector(a.fwd, 2.0 * state.size).addScaledVector(a.upv, 0.45 * state.size);
    _fpE.set(look.pitch, Math.PI + look.yaw, 0);   // 機体の +Z（機首）を、カメラの前（-Z）に合わせる
    _fpQ.setFromEuler(_fpE);
    camera.quaternion.copy(a.q).multiply(_fpQ);
  }

  function updateCamera(dt) {
    if (state.view === 'fp') { updateFirstPerson(dt); return; }
    setFov(DEFAULT_FOV);
    // 視点（斜め／真上）へなめらかに移る
    var goal = state.view === 'top' ? Math.PI / 2 : cam.pitchOb;
    cam.pitch += (goal - cam.pitch) * (1 - Math.exp(-5 * dt));
    // 真上では「画面の上」を水平方向に取り直す（上方向と視線が重ならないように）
    var t = clamp((cam.pitch - 1.2) / (Math.PI / 2 - 1.2), 0, 1);
    camera.up.set(0, 1, 0).multiplyScalar(1 - t)
      .add(_v1.set(-Math.sin(cam.yaw), 0, -Math.cos(cam.yaw)).multiplyScalar(t)).normalize();
    var cp = Math.cos(cam.pitch);
    camera.position.set(
      cam.target.x + cam.dist * cp * Math.sin(cam.yaw),
      cam.target.y + cam.dist * Math.sin(cam.pitch),
      cam.target.z + cam.dist * cp * Math.cos(cam.yaw)
    );
    camera.lookAt(cam.target);
    // 霧は距離に合わせる（近づいたときに遠景を消しすぎない）
    scene.fog.near = cam.dist * 0.65;
    scene.fog.far = cam.dist * 2.0;
  }

    hideHint();
  });
  canvas.addEventListener('pointermove', function (e) {
    var prev = ptrs.get(e.pointerId);
    if (!prev) return;
    var dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    prev.x = e.clientX; prev.y = e.clientY;
    if (state.view === 'fp') {
      if (ptrs.size === 1) {
        look.yaw = clamp(look.yaw - dx * 0.005, -LOOK_YAW, LOOK_YAW);
        look.pitch = clamp(look.pitch - dy * 0.004, -LOOK_PITCH, LOOK_PITCH);
      }
    } else if (ptrs.size === 1) {
      cam.yaw -= dx * 0.0055;

        cam.pitch = cam.pitchOb;

  var lastT = performance.now();

      var h = sd / steps;
      for (var s = 0; s < steps; s++) {
        for (var i = 0; i < MAXN; i++) { var ai = air[i]; if (ai.on && !ai.dead) stepAircraft(ai, h); }
        if (state.mode !== 'free') stepBattle(h);
      }
      if (state.mode !== 'free') {
        stepParticles(sparkP, sd, 5, 0.9);
        stepParticles(flashP, sd, 0, 2.5);
      }
    }
    // 主観のあいだは、追っている機体の矢印と地面への線を消す（視界をさえぎるため）
    var fpSelf = state.view === 'fp' && followValid() ? state.followObj : null;
    for (var j = 0; j < MAXN; j++) {
      var aj = air[j];
      if (aj.on && !aj.dead) { sync(aj); aj.arrow.visible = aj !== fpSelf; aj.drop.visible = aj !== fpSelf; }
    }
    if (state.mode !== 'free') syncBattle();
    syncAceHalo();

    if (state.auto && ptrs.size === 0 && state.view !== 'fp') cam.yaw += 0.07 * dt;
    if (ptrs.size === 0) { var back = Math.exp(-3 * dt); look.yaw *= back; look.pitch *= back; }
    if (state.followCam && state.mode !== 'free') {
      // 追う機体を常に画面の中心にとらえる
      if (followValid()) {
        state.followLost = -1;
      } else if (!state.followObj) {
        // まだ誰も追っていない。追える機体が現れたら、すぐ追う
        var first = pickNearestTo(cam.target);
        if (first) setFollow(first);
      } else {
        // 追っていた機体が撃墜された。余韻のあと（オプション）、撃墜位置にいちばん近い、追える機体へ
        if (state.followLost < 0) state.followLost = 0;
        else if (!state.paused) state.followLost += dt;
        if (state.autoNext && state.followLost >= state.followDelay) {
          var best = pickNearestTo(cam.target);
          if (best) setFollow(best);
        }
      }
      if (followValid()) cam.target.lerp(state.followObj.pos, 1 - Math.exp(-14 * dt));   // 追えなくなったらその場で停止
      updateHud();
    }
    updateScore();
    updateCamera(dt);
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
