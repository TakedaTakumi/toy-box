<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スノードーム</title>
<style>
  :root {
    --bg: #e9eef7;
    --ink: #1b2640;
    --muted: #55627f;
    --chip: #ffffff;
    --chip-line: #cdd6e8;
    --btn: #2f4d9e;
    --btn-ink: #ffffff;
    --focus: #2f4d9e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1020;
      --ink: #e7ecfa;
      --muted: #94a3c6;
      --chip: #151c33;
      --chip-line: #2a3556;
      --btn: #9db2ff;
      --btn-ink: #0b1020;
      --focus: #9db2ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1020;
    --ink: #e7ecfa;
    --muted: #94a3c6;
    --chip: #151c33;
    --chip-line: #2a3556;
    --btn: #9db2ff;
    --btn-ink: #0b1020;
    --focus: #9db2ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    overflow: hidden;
    overscroll-behavior: none;
  }
  main {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  header { text-align: center; }
  h1 { margin: 0; font-size: 1.15rem; letter-spacing: .12em; }
  #status {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 12px;
    border: 1px solid var(--chip-line);
    border-radius: 999px;
    background: var(--chip);
    color: var(--muted);
    font-size: .8rem;
  }
  #stage {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    display: block;
    width: min(100%, 520px, calc((100svh - 264px) * 500 / 560));
    height: auto;
    aspect-ratio: 500 / 560;
    touch-action: none;
    cursor: grab;
    -webkit-tap-highlight-color: transparent;
  }
  canvas:active { cursor: grabbing; }
  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  button {
    font: inherit;
    font-size: .95rem;
    padding: 8px 20px;
    border: 0;
    border-radius: 999px;
    background: var(--btn);
    color: var(--btn-ink);
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .amount { display: flex; align-items: center; gap: 10px; width: min(100%, 360px); color: var(--muted); font-size: .85rem; }
  .amount span { min-width: 5em; }
  .amount input { flex: 1; min-width: 0; accent-color: var(--btn); }
  .amount output { min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
  .hint { margin: 0; color: var(--muted); font-size: .8rem; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>スノードーム</h1>
    <span id="status" role="status" aria-live="polite">ジャイロ: 確認中…</span>
  </header>
  <div id="stage"><canvas id="globe" aria-label="スノードーム。傾けたり振ったりすると雪が舞います"></canvas></div>
  <label class="amount" for="amount"><span>雪の量</span>
    <input id="amount" type="range" min="50" max="600" step="10" value="240">
    <output id="amountOut" for="amount">240</output>
  </label>
  <label class="amount" for="fluff"><span>ふわふわ度</span>
    <input id="fluff" type="range" min="0" max="100" step="5" value="70">
    <output id="fluffOut" for="fluff">70</output>
  </label>
  <div class="controls">
    <button id="enable" type="button" hidden>ジャイロを使う</button>
    <button id="shake" type="button">ふる</button>
  </div>
  <p class="hint">スマホを傾ける・振る。ジャイロがなければ、ドームをドラッグ</p>
</main>
<script>
(() => {
  const W = 500, H = 560, CX = 250, CY = 235, R = 200;
  const FLOOR = CY + 0.6 * R;
  const LIP = 388;
  const GLASS = 4, PILE = 9;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COUNT = reduceMotion ? 110 : 240;
  const COUNT_MAX = reduceMotion ? 300 : 600;
  const GRAVITY = reduceMotion ? 70 : 100;
  const SWAY = reduceMotion ? 8 : 38;
  const FLUFF_DEFAULT = 70, FLUFF_BASE = 40;

  const canvas = document.getElementById('globe');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const enableBtn = document.getElementById('enable');
  const shakeBtn = document.getElementById('shake');

  let scale = 1, backLayer = null, frontLayer = null;

  function makeLayer(draw) {
    const c = document.createElement('canvas');
    c.width = canvas.width;
    c.height = canvas.height;
    const g = c.getContext('2d');
    g.scale(scale, scale);
    draw(g);
    return c;
  }

  function rng(seed) {
    let s = seed;
    return () => (s = (s * 16807) % 2147483647) / 2147483647;
  }

  function tree(g, x, baseY, h, w) {
    g.fillStyle = '#4a3326';
    g.fillRect(x - 3, baseY - 6, 6, 8);
    for (let i = 0; i < 3; i++) {
      const top = baseY - 6 - h + i * (h * 0.26);
      const bottom = baseY - 6 - h * 0.18 * (2 - i) - (i === 2 ? 0 : 0);
      const half = w * (0.5 + i * 0.25) / 1.5;
      g.fillStyle = i % 2 ? '#1f5a45' : '#27694f';
      g.beginPath();
      g.moveTo(x, top);
      g.lineTo(x + half, bottom);
      g.lineTo(x - half, bottom);
      g.closePath();
      g.fill();
      g.fillStyle = 'rgba(240,247,255,.92)';
      g.beginPath();
      g.moveTo(x, top);
      g.lineTo(x + half * 0.55, top + (bottom - top) * 0.55);
      g.quadraticCurveTo(x, top + (bottom - top) * 0.42, x - half * 0.55, top + (bottom - top) * 0.55);
      g.closePath();
      g.fill();
    }
  }

  function house(g, x, baseY) {
    const w = 78, h = 52;
    const glow = g.createRadialGradient(x + 4, baseY - 28, 2, x + 4, baseY - 28, 70);
    glow.addColorStop(0, 'rgba(255,196,96,.38)');
    glow.addColorStop(1, 'rgba(255,196,96,0)');
    g.fillStyle = glow;
    g.fillRect(x - 80, baseY - 100, 170, 120);
    g.fillStyle = '#6b4a3a';
    g.fillRect(x - w / 2, baseY - h, w, h);
    g.fillStyle = '#5a3d30';
    g.fillRect(x + 20, baseY - h - 22, 12, 24);
    g.fillStyle = 'rgba(240,247,255,.95)';
    g.fillRect(x + 18, baseY - h - 26, 16, 6);
    g.fillStyle = '#3d2a24';
    g.beginPath();
    g.moveTo(x - w / 2 - 8, baseY - h + 2);
    g.lineTo(x, baseY - h - 36);
    g.lineTo(x + w / 2 + 8, baseY - h + 2);
    g.closePath();
    g.fill();
    g.fillStyle = 'rgba(244,249,255,.96)';
    g.beginPath();
    g.moveTo(x - w / 2 - 10, baseY - h + 3);
    g.lineTo(x, baseY - h - 39);
    g.lineTo(x + w / 2 + 10, baseY - h + 3);
    g.lineTo(x + w / 2 + 2, baseY - h - 3);
    g.quadraticCurveTo(x, baseY - h - 24, x - w / 2 - 2, baseY - h - 3);
    g.closePath();
    g.fill();
    g.fillStyle = '#ffc46a';
    g.fillRect(x - 28, baseY - 38, 18, 18);
    g.fillRect(x + 12, baseY - 38, 18, 18);
    g.fillStyle = '#5a3d30';
    g.fillRect(x - 28, baseY - 30, 18, 2);
    g.fillRect(x - 20, baseY - 38, 2, 18);
    g.fillRect(x + 12, baseY - 30, 18, 2);
    g.fillRect(x + 20, baseY - 38, 2, 18);
    g.fillStyle = '#3d2a24';
    g.fillRect(x - 6, baseY - 26, 12, 26);
  }

  function paintBack(g) {
    g.save();
    g.beginPath();
    g.arc(CX, CY, R - 1, 0, Math.PI * 2);
    g.clip();
    const sky = g.createRadialGradient(CX, CY - 80, 20, CX, CY, R);
    sky.addColorStop(0, '#2c4a86');
    sky.addColorStop(0.6, '#16295a');
    sky.addColorStop(1, '#0a1533');
    g.fillStyle = sky;
    g.fillRect(0, 0, W, H);
    const rand = rng(7);
    for (let i = 0; i < 46; i++) {
      const a = rand() * Math.PI * 2, d = Math.sqrt(rand()) * R * 0.9;
      g.fillStyle = `rgba(255,255,255,${0.25 + rand() * 0.5})`;
      g.fillRect(CX + Math.cos(a) * d, CY + Math.sin(a) * d * 0.9 - 20, 1.4, 1.4);
    }
    const moon = g.createRadialGradient(CX + 92, CY - 96, 2, CX + 92, CY - 96, 26);
    moon.addColorStop(0, 'rgba(255,248,220,1)');
    moon.addColorStop(0.45, 'rgba(255,248,220,.9)');
    moon.addColorStop(1, 'rgba(255,248,220,0)');
    g.fillStyle = moon;
    g.fillRect(CX + 60, CY - 130, 70, 70);
    tree(g, CX - 112, FLOOR + 2, 78, 50);
    tree(g, CX + 108, FLOOR + 2, 96, 58);
    tree(g, CX + 74, FLOOR + 2, 58, 40);
    house(g, CX - 18, FLOOR + 2);
    const snow = g.createLinearGradient(0, FLOOR - 6, 0, 400);
    snow.addColorStop(0, '#f2f8ff');
    snow.addColorStop(1, '#aebfdc');
    g.fillStyle = snow;
    g.beginPath();
    g.moveTo(0, 410);
    g.lineTo(0, FLOOR + 2);
    for (let x = 0; x <= W; x += 10) g.lineTo(x, FLOOR + 2 - Math.sin(x * 0.045) * 2.4 - Math.sin(x * 0.11) * 1.2);
    g.lineTo(W, 410);
    g.closePath();
    g.fill();
    g.restore();

    const shadow = g.createRadialGradient(CX, 528, 10, CX, 528, 210);
    shadow.addColorStop(0, 'rgba(0,0,0,.32)');
    shadow.addColorStop(1, 'rgba(0,0,0,0)');
    g.save();
    g.translate(0, 528);
    g.scale(1, 0.12);
    g.translate(0, -528);
    g.fillStyle = shadow;
    g.fillRect(0, 300, W, 460);
    g.restore();

    const body = g.createLinearGradient(0, 400, 0, 522);
    body.addColorStop(0, '#6b4130');
    body.addColorStop(1, '#341c14');
    g.fillStyle = body;
    g.beginPath();
    g.moveTo(CX - 152, 404);
    g.lineTo(CX + 152, 404);
    g.lineTo(CX + 196, 506);
    g.quadraticCurveTo(CX + 198, 522, CX + 180, 522);
    g.lineTo(CX - 180, 522);
    g.quadraticCurveTo(CX - 198, 522, CX - 196, 506);
    g.closePath();
    g.fill();
    g.fillStyle = 'rgba(255,255,255,.07)';
    g.fillRect(CX - 170, 450, 340, 2);
    const gold = g.createLinearGradient(0, LIP, 0, LIP + 22);
    gold.addColorStop(0, '#f2d08a');
    gold.addColorStop(0.5, '#c79a45');
    gold.addColorStop(1, '#8a6425');
    g.fillStyle = gold;
    g.beginPath();
    g.roundRect(CX - 160, LIP, 320, 22, 10);
    g.fill();
  }

  function paintFront(g) {
    g.save();
    g.beginPath();
    g.rect(0, 0, W, LIP);
    g.clip();
    const sheen = g.createRadialGradient(CX - 40, CY - 60, R * 0.55, CX, CY, R);
    sheen.addColorStop(0, 'rgba(255,255,255,0)');
    sheen.addColorStop(0.85, 'rgba(255,255,255,.07)');
    sheen.addColorStop(1, 'rgba(255,255,255,.2)');
    g.fillStyle = sheen;
    g.beginPath();
    g.arc(CX, CY, R, 0, Math.PI * 2);
    g.fill();
    g.strokeStyle = 'rgba(255,255,255,.4)';
    g.lineWidth = 3;
    g.beginPath();
    g.arc(CX, CY, R - 1.5, 0, Math.PI * 2);
    g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.5)';
    g.lineWidth = 7;
    g.lineCap = 'round';
    g.beginPath();
    g.arc(CX, CY, R - 16, Math.PI * 1.08, Math.PI * 1.36);
    g.stroke();
    g.lineWidth = 4;
    g.beginPath();
    g.arc(CX, CY, R - 16, Math.PI * 1.43, Math.PI * 1.48);
    g.stroke();
    g.restore();
  }

  function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = canvas.clientWidth || 300;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(w * dpr * H / W);
    scale = canvas.width / W;
    backLayer = makeLayer(paintBack);
    frontLayer = makeLayer(paintFront);
  }

  const flakes = [];
  function randomInside() {
    for (;;) {
      const a = Math.random() * Math.PI * 2, d = Math.sqrt(Math.random()) * (R - 12);
      const x = CX + Math.cos(a) * d, y = CY + Math.sin(a) * d;
      if (y < FLOOR - 8) return [x, y];
    }
  }
  function spawnTop() {
    for (;;) {
      const x = CX + (Math.random() * 2 - 1) * R, y = CY - R + 14 + Math.random() * R * 0.55;
      if (Math.hypot(x - CX, y - CY) < R - 14) return [x, y];
    }
  }
  function addFlake(x, y) {
    const r = 1.1 + Math.random() * 2.1;
    flakes.push({ x, y, vx: 0, vy: 0, r, ph: Math.random() * 20, fx: 0.5 + Math.random() * 0.9, fy: 0.6 + Math.random() * 0.8, k: 2.8 - (r - 1.1) / 2.1, stir: 0, sd: 0.22 + Math.random() * 0.2, lift: Math.random() });
  }
  function setCount(n, fromTop) {
    while (flakes.length < n) addFlake(...(fromTop ? spawnTop() : randomInside()));
    flakes.length = n;
  }
  setCount(COUNT, false);

  const amountEl = document.getElementById('amount');
  const amountOut = document.getElementById('amountOut');
  amountEl.max = COUNT_MAX;
  amountEl.value = COUNT;
  amountOut.textContent = COUNT;
  amountEl.addEventListener('input', () => {
    const n = Number(amountEl.value);
    amountOut.textContent = n;
    setCount(n, true);
  });

  const fluff = { g: 1, sw: 1, k: 1, sd: 1 };
  const fluffEl = document.getElementById('fluff');
  const fluffOut = document.getElementById('fluffOut');
  function setFluff(f) {
    const u = (f - FLUFF_BASE) / 60;
    fluff.g = 2 ** (-1.2 * u);
    fluff.sw = 2 ** (1.2 * u);
    fluff.k = 2 ** (-0.8 * u);
    fluff.sd = 2 ** (-1.2 * u);
    fluffOut.textContent = f;
  }
  fluffEl.value = FLUFF_DEFAULT;
  setFluff(FLUFF_DEFAULT);
  fluffEl.addEventListener('input', () => setFluff(Number(fluffEl.value)));

  function shake(strength) {
    for (const p of flakes) {
      p.stir = Math.min(1, p.stir + strength / 400);
      p.vx += (Math.random() - 0.5) * 2 * strength;
      p.vy += (Math.random() - 0.5) * 2 * strength - strength * 0.6 * Math.random();
    }
  }

  let tgx = 0, tgy = 1, gx = 0, gy = 1;
  let gyroActive = false;

  function step(dt, t) {
    const k = Math.min(1, dt * 6);
    gx += (tgx - gx) * k;
    gy += (tgy - gy) * k;
    for (const p of flakes) {
      const s = p.stir;
      const g = GRAVITY * fluff.g * (1 - 0.75 * s), sw = SWAY * fluff.sw * (1 + 1.5 * s);
      p.vx += (gx * g + Math.sin(t * p.fx + p.ph) * sw) * dt;
      p.vy += (gy * g + Math.cos(t * p.fy + p.ph * 1.3) * sw * 0.6) * dt;
      if (s > 0) p.stir = Math.max(0, s - p.sd * fluff.sd * dt);
      const damp = Math.exp(-p.k * fluff.k * (1 - 0.6 * s) * dt);
      p.vx *= damp;
      p.vy *= damp;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      let touched = false;
      for (let i = 0; i < 2; i++) {
        const rw = R - GLASS - p.r - p.lift * PILE;
        const dx = p.x - CX, dy = p.y - CY, d = Math.hypot(dx, dy);
        if (d > rw) {
          const nx = dx / d, ny = dy / d;
          p.x = CX + nx * rw;
          p.y = CY + ny * rw;
          const vn = p.vx * nx + p.vy * ny;
          if (vn > 0) { p.vx -= 1.3 * vn * nx; p.vy -= 1.3 * vn * ny; }
          touched = true;
        }
        const fy = FLOOR - p.r - p.lift * PILE;
        if (p.y > fy) {
          p.y = fy;
          if (p.vy > 0) p.vy *= -0.2;
          p.vx *= 0.9;
          touched = true;
        }
      }
      if (touched) {
        p.vx += (Math.random() - 0.5) * dt * 360;
        p.vy += (Math.random() - 0.5) * dt * 360;
      }
    }
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(backLayer, 0, 0);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath();
    for (const p of flakes) {
      ctx.moveTo(p.x + p.r, p.y);
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(frontLayer, 0, 0);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    step(dt, now / 1000);
    draw();
    requestAnimationFrame(frame);
  }

  function setStatus(text) { statusEl.textContent = text; }

  function onOrient(e) {
    if (e.beta == null || e.gamma == null) return;
    if (!gyroActive) { gyroActive = true; setStatus('ジャイロ: 使用中'); enableBtn.hidden = true; }
    const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
    let x = Math.cos(b) * Math.sin(g);
    let y = Math.sin(b) + 0.12;
    const ang = ((screen.orientation && screen.orientation.angle) || window.orientation || 0);
    const a = ((ang % 360) + 360) % 360;
    if (a === 90) [x, y] = [y, -x];
    else if (a === 180) [x, y] = [-x, -y];
    else if (a === 270) [x, y] = [-y, x];
    const m = Math.hypot(x, y) || 1;
    const s = Math.min(1, m) / m;
    tgx = x * s;
    tgy = y * s;
  }

  let lastMag = null, lastShake = 0;
  function onMotion(e) {
    const a = e.acceleration;
    let mag;
    if (a && a.x != null) {
      mag = Math.hypot(a.x, a.y, a.z);
    } else {
      const g = e.accelerationIncludingGravity;
      if (!g || g.x == null) return;
      const m = Math.hypot(g.x, g.y, g.z);
      mag = lastMag == null ? 0 : Math.abs(m - lastMag);
      lastMag = m;
    }
    if (mag > 7) {
      const now = performance.now();
      if (now - lastShake > 60) {
        lastShake = now;
        shake(Math.min((mag - 7) * 45 + 150, 700));
      }
    }
  }

  let listening = false;
  function listen() {
    if (listening) return;
    listening = true;
    window.addEventListener('deviceorientation', onOrient);
    window.addEventListener('devicemotion', onMotion);
    setTimeout(() => {
      if (!gyroActive) setStatus('ジャイロを検出できません。ドラッグで操作できます');
    }, 1500);
  }

  async function enableGyro() {
    const DOE = window.DeviceOrientationEvent, DME = window.DeviceMotionEvent;
    const asks = [];
    if (DOE && typeof DOE.requestPermission === 'function') asks.push(DOE.requestPermission());
    if (DME && typeof DME.requestPermission === 'function') asks.push(DME.requestPermission());
    if (asks.length) {
      try {
        const results = await Promise.all(asks);
        if (!results.every((r) => r === 'granted')) throw new Error('denied');
      } catch (err) {
        setStatus('モーションが許可されていません。ドラッグで操作できます');
        return;
      }
    }
    setStatus('ジャイロ: 確認中…');
    listen();
  }

  const needsPermission = window.DeviceOrientationEvent && typeof window.DeviceOrientationEvent.requestPermission === 'function';
  if (needsPermission) {
    enableBtn.hidden = false;
    setStatus('「ジャイロを使う」を押すと、傾きで動きます');
  } else if (window.DeviceOrientationEvent) {
    enableGyro();
  } else {
    setStatus('ジャイロ非対応です。ドラッグで操作できます');
  }
  enableBtn.addEventListener('click', enableGyro);
  shakeBtn.addEventListener('click', () => shake(500));
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); shake(500); }
  });

  let drag = null;
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    drag = { x: e.clientX, y: e.clientY, t: performance.now() };
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const now = performance.now();
    const dt = Math.max((now - drag.t) / 1000, 0.008);
    const f = W / canvas.clientWidth;
    const vx = (e.clientX - drag.x) * f / dt, vy = (e.clientY - drag.y) * f / dt;
    drag = { x: e.clientX, y: e.clientY, t: now };
    const speed = Math.hypot(vx, vy);
    if (speed < 120) return;
    const cx = Math.max(-700, Math.min(700, vx)), cy = Math.max(-700, Math.min(700, vy));
    for (const p of flakes) {
      const w = 0.15 + Math.random() * 0.35;
      p.vx += cx * w;
      p.vy += cy * w;
    }
    shake(Math.min(speed * 0.12, 220));
  });
  const endDrag = () => { drag = null; };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fit, 100);
  });

  fit();
  requestAnimationFrame((now) => { last = now; frame(now); });
})();
</script>
</body>
</html>
