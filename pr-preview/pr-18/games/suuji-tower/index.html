<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>すうじタワー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --sky: #BFE8FF;
    --ground: #7ED69A;
    --ink: #2A2358;
    --bubble: #FFFFFF;
    --bubble-ink: #2A2358;
    --accent: #FFC93C;
    --good: #1FA971;
    --bad: #FF6B6B;
    --c0: #FF8A65;
    --c1: #FFC93C;
    --c2: #5CC8A8;
    --c3: #6EA8FF;
    --btn-ink: #2A2358;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky: #1E2250;
      --ground: #2B7F5B;
      --ink: #F2EEFF;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --sky: #1E2250;
    --ground: #2B7F5B;
    --ink: #F2EEFF;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    background: var(--sky);
    color: var(--ink);
    font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    font-weight: 500;
    display: flex;
    justify-content: center;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
  button:disabled { cursor: default; }

  .ground {
    position: fixed;
    left: -10%; right: -10%; bottom: -22%;
    height: 46%;
    background: var(--ground);
    border-radius: 50% 50% 0 0 / 40% 40% 0 0;
    z-index: 0;
  }
  #app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .screen {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 10px 16px 18px;
  }
  .screen[hidden] { display: none; }

  /* ---- monster ---- */
  .monster-slot {
    flex: 1;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: flex-end;
  }
  .m-svg { height: 100%; max-height: 280px; width: auto; max-width: 80%; overflow: visible; }
  .m-all { transform-box: fill-box; transform-origin: 50% 100%; }
  .m-eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 5s infinite; }
  .m-mouth { opacity: 0; transform-box: fill-box; transform-origin: 50% 30%; transform: scaleY(.2); }
  .m-smile { opacity: 1; }
  .m-svg.sad .m-smile { opacity: 0; }
  .m-svg.sad .m-sadmouth { opacity: 1; }
  .m-sadmouth { opacity: 0; }
  .m-svg.shake .m-all { animation: shake .45s ease-in-out; }
  .m-svg.hop .m-all { animation: hop .5s ease-out; }
  .m-svg.party .m-all { animation: hop .7s ease-out 2; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px) rotate(-3deg); } 40% { transform: translateX(10px) rotate(3deg); } 60% { transform: translateX(-7px); } 80% { transform: translateX(7px); } }
  @keyframes hop { 0% { transform: translateY(0) scale(1, 1); } 30% { transform: translateY(-22px) scale(.97, 1.04); } 60% { transform: translateY(0) scale(1.05, .94); } 100% { transform: translateY(0) scale(1, 1); } }

  /* ---- home ---- */
  .title { margin: 14px 0 4px; text-align: center; font-size: clamp(32px, 9vw, 44px); font-weight: 800; line-height: 1.15; }
  .lead { margin: 0 0 6px; text-align: center; font-size: clamp(15px, 4.2vw, 19px); }
  .top-right { display: flex; justify-content: flex-end; height: 48px; }
  .opts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; gap: 6px; }
  .row-label { width: 4.6em; font-size: 14px; font-weight: 800; white-space: nowrap; line-height: 1.2; }
  .row-label small { display: block; font-size: 11px; }
  .opt {
    flex: 1;
    height: 40px;
    border-radius: 999px;
    background: var(--bubble);
    color: var(--bubble-ink);
    font-size: 17px;
    font-weight: 800;
    box-shadow: 0 3px 0 rgba(42, 35, 88, .22);
  }
  .opt[aria-pressed="true"] {
    background: var(--accent);
    box-shadow: 0 3px 0 rgba(42, 35, 88, .35), inset 0 0 0 3px #2A2358;
  }
  .opt.wide { flex: 2; }
  .note { margin: -4px 0 0; padding-left: 4.6em; font-size: 12px; opacity: .85; }
  .mode {
    height: clamp(58px, 9.5vh, 72px);
    border-radius: 999px;
    font-size: clamp(22px, 6vw, 28px);
    font-weight: 800;
    color: var(--btn-ink);
    box-shadow: 0 6px 0 rgba(42, 35, 88, .28);
    transition: transform .08s, box-shadow .08s;
  }
  .mode:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(42, 35, 88, .28); }
  .mode.m-go { background: var(--c2); }
  .mode.m-sub { background: var(--c3); }
  .mode.m-add { background: var(--c0); }

  /* ---- play ---- */
  .topbar { display: flex; align-items: center; justify-content: space-between; height: 52px; }
  .icon-btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--bubble);
    color: var(--bubble-ink);
    font-size: 24px;
    line-height: 1;
    box-shadow: 0 4px 0 rgba(42, 35, 88, .22);
  }
  .icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(42, 35, 88, .22); }
  .progress { flex: 1; display: flex; align-items: center; gap: 10px; margin: 0 12px; min-width: 0; }
  .progress-bar { flex: 1; height: 14px; background: var(--bubble); border-radius: 999px; overflow: hidden; }
  .progress-bar.off { visibility: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .3s; }
  .progress-text { min-width: 4.4em; text-align: right; font-weight: 800; font-size: 19px; color: var(--ink); white-space: nowrap; }
  .bubble {
    position: relative;
    margin: 6px 4px 8px;
    padding: 8px 14px 10px;
    min-height: clamp(120px, 20vh, 160px);
    background: var(--bubble);
    color: var(--bubble-ink);
    border-radius: 30px;
    box-shadow: 0 5px 0 rgba(42, 35, 88, .16);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }
  .eq {
    display: flex; align-items: center; justify-content: center;
    gap: .18em;
    font-size: clamp(36px, min(8.6vh, 11.5vw), 70px);
    font-weight: 800;
    line-height: 1.1;
  }
  .eq .op { color: var(--bad); }
  .eq .ans { color: var(--bad); min-width: .9em; text-align: center; }
  .eq .ans.solved { color: var(--good); }
  .eq .ans.wrong { color: var(--bad); }
  .msg { min-height: 1.5em; font-size: clamp(17px, 4.6vw, 21px); font-weight: 800; text-align: center; }
  .msg.good { color: var(--good); }
  .msg.bad { color: var(--bad); }
  .gauge { width: 100%; height: 12px; margin: 2px 0 6px; background: #E8E2FF; border-radius: 999px; overflow: hidden; }
  .gauge.off { visibility: hidden; }
  .gauge-fill { height: 100%; width: 100%; background: var(--c2); border-radius: 999px; }
  .gauge-fill.warn { background: var(--c0); }

  /* ---- tower ---- */
  .tower {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    overflow: hidden;
  }
  .tower-monster { flex: none; height: clamp(70px, 12vh, 110px); display: flex; justify-content: center; align-items: flex-end; }
  .tower-monster .m-svg { height: 100%; }
  .stack { flex: none; display: flex; flex-direction: column; align-items: center; }
  .block {
    width: clamp(110px, 34vw, 150px);
    height: clamp(18px, 3.2vh, 26px);
    margin-top: 2px;
    border-radius: 6px;
    font-size: clamp(11px, 1.9vh, 14px);
    font-weight: 800;
    line-height: clamp(18px, 3.2vh, 26px);
    text-align: center;
    color: var(--btn-ink);
    box-shadow: 0 2px 0 rgba(42, 35, 88, .28);
  }
  .block.b0 { background: var(--c0); }
  .block.b1 { background: var(--c1); }
  .block.b2 { background: var(--c2); }
  .block.b3 { background: var(--c3); }
  .block.drop { animation: drop .3s ease-out; }
  @keyframes drop { 0% { transform: translateY(-26px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .key {
    height: clamp(48px, 8vh, 64px);
    border-radius: 18px;
    background: var(--bubble);
    color: var(--bubble-ink);
    font-size: clamp(26px, 4.4vh, 34px);
    font-weight: 800;
    box-shadow: 0 5px 0 rgba(42, 35, 88, .28);
    transition: transform .08s, box-shadow .08s, opacity .2s;
  }
  .key:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(42, 35, 88, .28); }
  .key.key-del { background: var(--c1); font-size: clamp(18px, 3vh, 22px); }
  .key.key-ok { background: var(--c2); font-size: clamp(22px, 3.6vh, 28px); }
  .key:disabled { opacity: .35; pointer-events: none; }

  .star-pop { position: fixed; z-index: 60; pointer-events: none; font-size: 28px; }

  /* ---- rest ---- */
  .rest {
    position: absolute;
    inset: 0;
    z-index: 40;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
    padding: 24px 24px 32px;
    background: color-mix(in srgb, var(--sky) 92%, transparent);
  }
  .rest[hidden] { display: none; }
  .rest-title { margin: 0; text-align: center; font-size: clamp(28px, 8vw, 38px); font-weight: 800; }
  .rest-sub { margin: 0 0 8px; text-align: center; font-size: clamp(16px, 4.4vw, 19px); line-height: 1.6; }

  /* ---- result ---- */
  .result-body { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 14px; }
  .r-emoji { font-size: clamp(52px, 14vw, 68px); line-height: 1; }
  .result-title { margin: 6px 0 0; font-size: clamp(28px, 8vw, 38px); font-weight: 800; text-align: center; }
  .result-sub { margin: 0; font-size: clamp(16px, 4.4vw, 19px); text-align: center; line-height: 1.5; }
  .result-best { margin: 4px 0 0; padding: 6px 18px; background: var(--bubble); color: #0E7A51; border-radius: 999px; font-size: clamp(16px, 4.6vw, 20px); font-weight: 800; text-align: center; }
  .result-actions { display: flex; flex-direction: column; gap: 12px; }

  @media (max-height: 640px) {
    .m-svg { max-height: 150px; }
    .title { margin-top: 4px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .m-eyes, .m-svg.shake .m-all, .m-svg.hop .m-all, .m-svg.party .m-all, .block.drop { animation: none; }
    .mode, .key, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<div class="ground" aria-hidden="true"></div>

<main id="app">

  <!-- ホーム -->
  <section id="home" class="screen">
    <div class="top-right"><button class="icon-btn sound-btn" aria-label="おと">🔊</button></div>
    <h1 class="title">すうじタワー</h1>
    <p class="lead">まちがえたら そこまで。<br>ミスなしで どこまで のぼれる？</p>
    <div class="monster-slot" data-monster="home"></div>
    <div class="opts">
      <div class="row" role="group" aria-label="1もんの せいげんじかん">
        <span class="row-label">じかん<small>（びょう）</small></span>
        <button class="opt" data-opt="seconds" data-value="5" aria-label="5びょう" aria-pressed="false">5</button>
        <button class="opt" data-opt="seconds" data-value="10" aria-label="10びょう" aria-pressed="true">10</button>
        <button class="opt" data-opt="seconds" data-value="15" aria-label="15びょう" aria-pressed="false">15</button>
        <button class="opt" data-opt="seconds" data-value="20" aria-label="20びょう" aria-pressed="false">20</button>
        <button class="opt" data-opt="seconds" data-value="0" aria-pressed="false">なし</button>
      </div>
      <div class="row" role="group" aria-label="ひとやすみの まびき">
        <span class="row-label">やすみ</span>
        <button class="opt" data-opt="rest" data-value="25" aria-pressed="true">25もんごと</button>
        <button class="opt" data-opt="rest" data-value="50" aria-pressed="false">50もんごと</button>
      </div>
      <div class="row" role="group" aria-label="タワーの たかさ">
        <span class="row-label">たかさ</span>
        <button class="opt" data-opt="endless" data-value="0" aria-pressed="true">ちょうじょう</button>
        <button class="opt" data-opt="endless" data-value="1" aria-pressed="false">むげん</button>
      </div>
      <p class="note" id="heightNote"></p>
    </div>
    <button class="mode m-go" id="startBtn">のぼる！</button>
  </section>

  <!-- あそぶ -->
  <section id="play" class="screen" hidden>
    <div class="topbar">
      <button class="icon-btn" id="homeBtn" aria-label="ホームにもどる">🏠</button>
      <div class="progress">
        <div class="progress-bar" id="progressBar" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
        <span class="progress-text" id="progressText" aria-live="polite"></span>
      </div>
      <button class="icon-btn sound-btn" aria-label="おと">🔊</button>
    </div>
    <div class="bubble" aria-live="polite">
      <div class="gauge" id="gauge" aria-hidden="true"><div class="gauge-fill" id="gaugeFill"></div></div>
      <div class="eq" id="eq"></div>
      <div class="msg" id="msg">&nbsp;</div>
    </div>
    <div class="tower" aria-hidden="true">
      <div class="tower-monster" data-monster="play"></div>
      <div class="stack" id="stack"></div>
    </div>
    <div class="keypad" id="keypad"></div>

    <div class="rest" id="rest" hidden>
      <p class="rest-title" id="restTitle"></p>
      <p class="rest-sub">タイマーは とまっているよ。<br>のみものを のんだり、のびを したりしてね。</p>
      <button class="mode m-go" id="resumeBtn">つづける</button>
      <button class="mode m-sub" id="quitBtn">ここで おわる</button>
    </div>
  </section>

  <!-- けっか -->
  <section id="result" class="screen" hidden>
    <div class="result-body">
      <div class="r-emoji" id="rEmoji" aria-hidden="true"></div>
      <p class="result-title" id="rTitle"></p>
      <p class="result-sub" id="rSub"></p>
      <p class="result-best" id="rBest"></p>
    </div>
    <div class="monster-slot" data-monster="result"></div>
    <div class="result-actions">
      <button class="mode m-go" id="againBtn">もういちど</button>
      <button class="mode m-sub" id="toHomeBtn">ホームにもどる</button>
    </div>
  </section>

</main>

<script>
(function () {
  "use strict";

  /* ===== 設定 ===== */
  var SECONDS_CHOICES = [5, 10, 15, 20, 0]; // 0 は制限時間なし
  var REST_CHOICES = [25, 50];
  var DEFAULT_SECONDS = 10;
  var DEFAULT_REST = 25;
  var VISIBLE_BLOCKS = 5; // 画面に見せる塔の階数
  var CORRECT_PAUSE_MS = 650;
  var FAIL_PAUSE_MS = 1400;

  /* ===== ユーティリティ ===== */
  var $ = function (s, root) { return (root || document).querySelector(s); };
  var $$ = function (s, root) { return Array.prototype.slice.call((root || document).querySelectorAll(s)); };
  var rnd = function (min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; };
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = rnd(0, i), t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function load(k, d) {
    try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; }
  }
  function save(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 保存できなくても遊べる */ }
  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* ===== モンスター ===== */
  var MONSTER_SVG =
    '<svg class="m-svg" viewBox="0 0 240 230" role="img" aria-label="モンスター">' +
    '<ellipse cx="120" cy="214" rx="78" ry="9" fill="rgba(0,0,0,.16)"/>' +
    '<g class="m-all">' +
    '<path d="M72 62 L56 22 L98 46Z" fill="#FFC93C"/>' +
    '<path d="M168 62 L184 22 L142 46Z" fill="#FFC93C"/>' +
    '<ellipse cx="84" cy="206" rx="26" ry="12" fill="#6B45D6"/>' +
    '<ellipse cx="156" cy="206" rx="26" ry="12" fill="#6B45D6"/>' +
    '<path d="M38 132 C38 70 76 42 120 42 C164 42 202 70 202 132 C202 180 172 208 120 208 C68 208 38 180 38 132Z" fill="#8A63F2"/>' +
    '<ellipse cx="120" cy="172" rx="50" ry="30" fill="#B9A2FF"/>' +
    '<ellipse cx="62" cy="126" rx="12" ry="8" fill="#FF8FB1" opacity=".6"/>' +
    '<ellipse cx="178" cy="126" rx="12" ry="8" fill="#FF8FB1" opacity=".6"/>' +
    '<g class="m-eyes">' +
    '<circle cx="92" cy="94" r="17" fill="#fff"/><circle cx="148" cy="94" r="17" fill="#fff"/>' +
    '<circle cx="95" cy="97" r="8" fill="#2A2358"/><circle cx="145" cy="97" r="8" fill="#2A2358"/>' +
    '<circle cx="98" cy="93" r="2.6" fill="#fff"/><circle cx="148" cy="93" r="2.6" fill="#fff"/>' +
    '</g>' +
    '<path class="m-smile" d="M98 136 Q120 154 142 136" fill="none" stroke="#4A1D6B" stroke-width="6" stroke-linecap="round"/>' +
    '<path class="m-sadmouth" d="M98 150 Q120 130 142 150" fill="none" stroke="#4A1D6B" stroke-width="6" stroke-linecap="round"/>' +
    '<ellipse class="m-target" cx="120" cy="120" rx="10" ry="10" fill="none"/>' +
    '</g></svg>';

  $$("[data-monster]").forEach(function (slot) { slot.innerHTML = MONSTER_SVG; });
  var playMonster = $('[data-monster="play"] .m-svg');
  var homeMonster = $('[data-monster="home"] .m-svg');
  var resultMonster = $('[data-monster="result"] .m-svg');

  function react(svg, cls, ms) {
    svg.classList.remove(cls);
    void svg.getBoundingClientRect();
    svg.classList.add(cls);
    setTimeout(function () { svg.classList.remove(cls); }, ms);
  }

  /* ===== 音 ===== */
  var soundOn = load("st_sound", true) !== false;
  var ac = null;
  function audio() {
    if (!soundOn) return null;
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
    }
    if (ac && ac.state === "suspended") { try { ac.resume(); } catch (e) {} }
    return ac;
  }
  function tone(freq, start, dur, type, gain, endFreq) {
    var c = audio();
    if (!c) return;
    var t = c.currentTime + start;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain || 0.15, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  var sfx = {
    ok: function () { tone(660, 0, .1, "sine", .15); tone(880, .08, .14, "sine", .15); },
    miss: function () { tone(300, 0, .16, "triangle", .14, 240); tone(230, .14, .22, "triangle", .12, 180); },
    rest: function () { [523, 659, 784].forEach(function (f, i) { tone(f, i * .1, .2, "sine", .13); }); },
    done: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * .12, .22, "sine", .15); }); },
    tap: function () { tone(520, 0, .06, "sine", .1); }
  };
  function refreshSoundBtns() {
    $$(".sound-btn").forEach(function (b) {
      b.textContent = soundOn ? "🔊" : "🔇";
      b.setAttribute("aria-label", soundOn ? "おとを けす" : "おとを だす");
    });
  }
  $$(".sound-btn").forEach(function (b) {
    b.addEventListener("click", function () {
      soundOn = !soundOn;
      save("st_sound", soundOn);
      refreshSoundBtns();
      if (soundOn) sfx.tap();
    });
  });
  refreshSoundBtns();

  /* ===== 画面切り替え ===== */
  function show(id) {
    ["home", "play", "result"].forEach(function (s) { $("#" + s).hidden = (s !== id); });
  }

  /* ===== 出題（ごちゃまぜ × むずかしい） ===== */
  // たし算・ひき算の全問題。ひき算は答えが0の式も含み、同じ数の組でも穴の位置が違えば別問題にする
  function allQuestions() {
    var list = [];
    ["add", "sub"].forEach(function (op) {
      for (var a = (op === "add" ? 1 : 2); a <= 9; a++) {
        var bMax = op === "add" ? 9 : a;
        for (var b = 1; b <= bMax; b++) {
          var c = op === "add" ? a + b : a - b;
          ["a", "b"].forEach(function (hole) {
            var q = { op: op, a: a, b: b, c: c, hole: hole };
            q.ans = q[hole];
            list.push(q);
          });
        }
      }
    });
    return list;
  }

  function sameQuestion(x, y) {
    return x.op === y.op && x.a === y.a && x.b === y.b && x.hole === y.hole;
  }

  // 周回の切れ目で同じ問題が2回続かないようにする
  function newPool(prevLast) {
    var pool = shuffle(allQuestions());
    if (prevLast && sameQuestion(pool[0], prevLast)) {
      var t = pool[0]; pool[0] = pool[pool.length - 1]; pool[pool.length - 1] = t;
    }
    return pool;
  }

  /* ===== ホームの設定 ===== */
  var settings = { seconds: DEFAULT_SECONDS, rest: DEFAULT_REST, endless: false };
  var bests = {}; // 設定の組み合わせごとの最高階数（メモリ上だけ。保存しない）

  function renderOpts() {
    $$(".opt").forEach(function (b) {
      var key = b.getAttribute("data-opt"), v = Number(b.getAttribute("data-value"));
      var cur = key === "endless" ? (settings.endless ? 1 : 0) : settings[key];
      b.setAttribute("aria-pressed", String(v === cur));
    });
    $("#heightNote").textContent = settings.endless
      ? "250もん ぜんぶ とくと、もういちど シャッフルして つづくよ（おなじ もんだいが でるよ）"
      : "250もん ぜんぶ せいかいで、ちょうじょう クリア！";
  }
  $$(".opt").forEach(function (b) {
    b.addEventListener("click", function () {
      var key = b.getAttribute("data-opt"), v = Number(b.getAttribute("data-value"));
      if (key === "seconds" && SECONDS_CHOICES.indexOf(v) === -1) return;
      if (key === "rest" && REST_CHOICES.indexOf(v) === -1) return;
      if (key === "endless") settings.endless = v === 1; else settings[key] = v;
      renderOpts();
      sfx.tap();
    });
  });
  renderOpts();

  /* ===== ゲーム状態 ===== */
  var G = null;

  /* ===== 制限時間 ===== */
  var qTimer = { raf: 0, left: 0, last: 0 };
  function drawGauge() {
    var total = G.seconds * 1000;
    var ratio = Math.max(0, qTimer.left / total);
    if (reduceMotion) ratio = Math.ceil(qTimer.left / 1000) / G.seconds;
    var fill = $("#gaugeFill");
    fill.style.width = (ratio * 100) + "%";
    fill.classList.toggle("warn", qTimer.left <= 3000);
  }
  function stopQTimer() {
    if (qTimer.raf) cancelAnimationFrame(qTimer.raf);
    qTimer.raf = 0;
  }
  function startQTimer() {
    stopQTimer();
    $("#gauge").classList.toggle("off", G.seconds === 0);
    if (G.seconds === 0) return;
    qTimer.left = G.seconds * 1000;
    qTimer.last = performance.now();
    drawGauge();
    var game = G;
    var tick = function (now) {
      if (G !== game || G.locked) { qTimer.raf = 0; return; }
      var delta = Math.min(now - qTimer.last, 100); // 別のタブに移っている間は進めない
      qTimer.last = now;
      qTimer.left -= delta;
      if (qTimer.left <= 0) {
        qTimer.left = 0;
        drawGauge();
        qTimer.raf = 0;
        finish("timeout");
        return;
      }
      drawGauge();
      qTimer.raf = requestAnimationFrame(tick);
    };
    qTimer.raf = requestAnimationFrame(tick);
  }

  /* ===== プレイ ===== */
  function setMsg(text, cls) {
    var m = $("#msg");
    m.textContent = text || " ";
    m.className = "msg" + (cls ? " " + cls : "");
  }

  function startGame() {
    audio();
    var pool = newPool(null);
    G = {
      seconds: settings.seconds, rest: settings.rest, endless: settings.endless,
      pool: pool, total: pool.length, index: 0, floor: 0,
      typed: "", q: null, locked: false, ended: false
    };
    $("#rest").hidden = true;
    $("#stack").innerHTML = "";
    playMonster.classList.remove("sad");
    renderFloor();
    show("play");
    nextQuestion();
  }

  function renderFloor() {
    $("#progressText").textContent = G.endless ? G.floor + "かい" : G.floor + " / " + G.total + "かい";
    $("#progressBar").classList.toggle("off", G.endless);
    $("#progressFill").style.width = (G.floor / G.total * 100) + "%";
  }

  function nextQuestion() {
    if (G.index >= G.pool.length) {
      G.pool = newPool(G.pool[G.pool.length - 1]);
      G.index = 0;
    }
    var q = G.pool[G.index];
    G.q = q; G.typed = ""; G.locked = false;
    var sym = q.op === "add" ? "＋" : "－";
    function slot(key, val) {
      return key === q.hole ? "<span class=\"ans\" id=\"ans\">？</span>" : "<span>" + val + "</span>";
    }
    $("#eq").innerHTML =
      slot("a", q.a) + "<span class=\"op\">" + sym + "</span>" + slot("b", q.b) +
      "<span>＝</span>" + slot("c", q.c);
    setMsg(G.floor === 0 ? "？に はいる かずを いれてね" : "");
    renderKeypad();
    startQTimer();
  }

  /* ===== テンキー ===== */
  function buildKeypad() {
    var pad = $("#keypad");
    ["1", "2", "3", "4", "5", "6", "7", "8", "9", "del", "0", "ok"].forEach(function (k) {
      var b = document.createElement("button");
      b.className = "key" + (k === "del" ? " key-del" : (k === "ok" ? " key-ok" : ""));
      b.textContent = k === "del" ? "けす" : (k === "ok" ? "OK" : k);
      b.addEventListener("click", function () { onKey(k); });
      pad.appendChild(b);
    });
  }

  function renderKeypad() {
    if (!$("#keypad").firstChild) buildKeypad();
    updateTyped();
  }

  function updateTyped() {
    var ans = $("#ans");
    if (ans) ans.textContent = G.typed === "" ? "？" : G.typed;
    $(".key-ok", $("#keypad")).disabled = G.typed === "" || G.locked;
  }

  function onKey(k) {
    if (!G || G.locked || G.ended) return;
    audio();
    if (k === "del") {
      G.typed = G.typed.slice(0, -1);
      sfx.tap();
      updateTyped();
      return;
    }
    if (k === "ok") {
      if (G.typed === "") return;
      if (Number(G.typed) === G.q.ans) onCorrect(); else finish("miss");
      return;
    }
    if (!/^[0-9]$/.test(k)) return;
    if (G.typed === "0") G.typed = ""; // 先頭の0は置き換える
    if (G.typed.length >= 2) return;
    G.typed += k;
    sfx.tap();
    updateTyped();
  }

  document.addEventListener("keydown", function (e) {
    if (!G || $("#play").hidden || !$("#rest").hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[0-9]$/.test(e.key)) onKey(e.key);
    else if (e.key === "Backspace") onKey("del");
    else if (e.key === "Enter") onKey("ok");
    else return;
    e.preventDefault();
  });

  /* ===== 演出 ===== */
  function addBlock() {
    var stack = $("#stack");
    var el = document.createElement("div");
    el.className = "block b" + (G.floor % 4) + (reduceMotion ? "" : " drop");
    el.textContent = G.floor + "かい";
    stack.insertBefore(el, stack.firstChild);
    while (stack.children.length > VISIBLE_BLOCKS) stack.removeChild(stack.lastChild);
  }

  function starBurst() {
    if (reduceMotion) return;
    var target = $(".m-target", playMonster);
    if (!target) return;
    var r = target.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (var i = 0; i < 4; i++) {
      var s = document.createElement("span");
      s.className = "star-pop";
      s.textContent = "⭐";
      s.style.left = (cx - 14) + "px";
      s.style.top = (cy - 14) + "px";
      document.body.appendChild(s);
      var ang = (-90 + (i - 1.5) * 40) * Math.PI / 180;
      var dist = 60 + rnd(0, 30);
      (function (el, ang, dist) {
        var a = el.animate(
          [
            { transform: "translate(0,0) scale(.4)", opacity: 1 },
            { transform: "translate(" + Math.cos(ang) * dist + "px," + Math.sin(ang) * dist + "px) scale(1.1)", opacity: 0 }
          ],
          { duration: 650, easing: "ease-out", fill: "forwards" }
        );
        a.finished.then(function () { el.remove(); }, function () { el.remove(); });
      })(s, ang, dist);
    }
  }

  var PRAISE = ["せいかい！", "いいね！", "のぼった！", "ばっちり！", "いいちょうし！"];

  function onCorrect() {
    G.locked = true;
    stopQTimer();
    updateTyped();
    var ans = $("#ans");
    ans.textContent = G.q.ans;
    ans.classList.add("solved");
    G.floor++;
    G.index++;
    sfx.ok();
    addBlock();
    renderFloor();
    react(playMonster, "hop", 520);
    starBurst();
    setMsg(PRAISE[rnd(0, PRAISE.length - 1)], "good");

    var game = G;
    wait(CORRECT_PAUSE_MS).then(function () {
      if (G !== game || G.ended) return;
      if (!G.endless && G.floor >= G.total) { finish("clear"); return; }
      if (G.floor % G.rest === 0) { showRest(); return; }
      nextQuestion();
    });
  }

  function showRest() {
    $("#restTitle").textContent = G.floor + "かい とうたつ！";
    $("#rest").hidden = false;
    sfx.rest();
    $("#resumeBtn").focus();
  }

  /* ===== 終了と結果 ===== */
  var REASON_TITLE = { miss: "まちがえた！", timeout: "じかんぎれ！", clear: "ちょうじょう クリア！", quit: "ひとやすみで おしまい" };

  function equationText(q) {
    var sym = q.op === "add" ? "＋" : "－";
    function s(key, val) { return key === q.hole ? "？" : String(val); }
    return s("a", q.a) + " " + sym + " " + s("b", q.b) + " ＝ " + s("c", q.c);
  }

  function finish(reason) {
    if (!G || G.ended) return;
    G.ended = true;
    G.locked = true;
    stopQTimer();
    var game = G;
    if (reason === "miss" || reason === "timeout") {
      var ans = $("#ans");
      ans.textContent = G.q.ans;
      ans.classList.add("wrong");
      updateTyped();
      playMonster.classList.add("sad");
      sfx.miss();
      react(playMonster, "shake", 500);
      setMsg(reason === "miss" ? "こたえは " + G.q.ans + " だったよ" : "じかんぎれ… こたえは " + G.q.ans, "bad");
      wait(FAIL_PAUSE_MS).then(function () { if (G === game) showResult(reason); });
    } else {
      showResult(reason);
    }
  }

  function bestKey() { return G.seconds + "_" + (G.endless ? "e" : "s"); }

  function showResult(reason) {
    var floor = G.floor;
    $("#rest").hidden = true;
    $("#rEmoji").textContent = reason === "clear" ? "🏆" : (reason === "quit" ? "☕" : "🗼");
    $("#rTitle").textContent = floor + "かい まで のぼれた！";
    var detail = REASON_TITLE[reason];
    if (reason === "miss" || reason === "timeout") {
      detail += "　" + equationText(G.q) + "　こたえは " + G.q.ans;
    } else if (reason === "clear") {
      detail += "　" + G.total + "もん ぜんぶ せいかい！";
    }
    $("#rSub").textContent = detail;

    var key = bestKey(), prev = bests[key];
    var best = $("#rBest");
    if (prev === undefined || floor > prev) {
      best.textContent = (prev !== undefined ? "ベストこうしん！　まえは " + prev + "かい" : "ベスト： " + floor + "かい");
      bests[key] = floor;
    } else {
      best.textContent = "ベスト： " + prev + "かい";
    }
    show("result");
    if (reason === "clear") { sfx.done(); react(resultMonster, "party", 1500); }
    else if (floor >= 1 && reason === "quit") { sfx.done(); react(resultMonster, "hop", 520); }
    else { react(resultMonster, "hop", 520); }
  }

  /* ===== イベント ===== */
  $("#startBtn").addEventListener("click", startGame);
  $("#againBtn").addEventListener("click", startGame);
  $("#homeBtn").addEventListener("click", function () { stopQTimer(); G = null; show("home"); });
  $("#toHomeBtn").addEventListener("click", function () { G = null; show("home"); });
  $("#resumeBtn").addEventListener("click", function () {
    if (!G || G.ended) return;
    $("#rest").hidden = true;
    sfx.tap();
    nextQuestion();
  });
  $("#quitBtn").addEventListener("click", function () { finish("quit"); });

  react(homeMonster, "hop", 520);
})();
</script>
</body>
</html>
