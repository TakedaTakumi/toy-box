<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>とけいのれんしゅう</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f3f6fb;
  --surface: #ffffff;
  --ink: #1c2438;
  --muted: #5d6a85;
  --line: #d3dbea;
  --face: #fffdf7;
  --case: #3b4a6b;
  --hour: #2f5fe0;
  --minute: #0b8f5f;
  --second: #e0364b;
  --crown: #8d99b5;
  --crown-line: #5d6a85;
  --btn: #eaf0ff;
  --btn-ink: #1c2438;
  --on-accent: #ffffff;
  --font: system-ui, -apple-system, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11151f;
    --surface: #1a2030;
    --ink: #e8ecf6;
    --muted: #9aa6c0;
    --line: #2b3550;
    --face: #1f2740;
    --case: #8da2d0;
    --hour: #7ea2ff;
    --minute: #4fd6a0;
    --second: #ff7186;
    --crown: #6c7a9c;
    --crown-line: #3a4666;
    --btn: #263052;
    --btn-ink: #e8ecf6;
    --on-accent: #11151f;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.6;
  padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
}
main { max-width: 34rem; margin: 0 auto; padding: 16px 16px 40px; }
h1 { margin: 4px 0 8px; font-size: 1.3rem; text-align: center; }

.clock-wrap { position: relative; }
#clock { display: block; width: 100%; height: auto; max-height: 70vh; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
#crown { transition: transform .18s ease-out; cursor: ew-resize; touch-action: none; outline: none; }
#crown:focus-visible .knob { stroke: var(--hour); stroke-width: 4; }
.knob { fill: var(--crown); stroke: var(--crown-line); stroke-width: 2; }
.ridge { stroke: var(--crown-line); stroke-width: 2; }
.stem { fill: var(--crown-line); }

.status {
  margin: 4px 0 12px;
  padding: 10px 14px;
  border-radius: 12px;
  background: var(--surface);
  border: 2px solid var(--line);
  text-align: center;
  font-weight: 700;
}
.status[data-pulled="true"] { border-color: var(--second); }
.crown-btn {
  display: block;
  margin: 0 auto 16px;
  min-height: 48px;
  padding: 10px 22px;
  border: 0;
  border-radius: 24px;
  background: var(--hour);
  color: var(--on-accent);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

.digital {
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 14px 12px 12px;
}
.digital-row { display: flex; align-items: center; justify-content: center; gap: 6px; }
.col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.label { font-size: .8rem; color: var(--muted); }
.num {
  min-width: 2.2ch;
  text-align: center;
  font-size: clamp(2.6rem, 14vw, 4rem);
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.num.h { color: var(--hour); }
.num.m { color: var(--minute); }
.num.s { color: var(--second); font-size: clamp(1.6rem, 8vw, 2.4rem); }
.sep { font-size: clamp(2.2rem, 12vw, 3.4rem); font-weight: 800; color: var(--muted); padding-bottom: 4px; }
.ampm { min-width: 3.4em; text-align: center; font-weight: 700; color: var(--muted); }
.step {
  width: 56px; height: 44px;
  border: 0; border-radius: 12px;
  background: var(--btn); color: var(--btn-ink);
  font-size: 1.3rem; font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
}
.step:disabled { opacity: .35; cursor: not-allowed; }
.step:active:not(:disabled) { transform: scale(.94); }
.step:focus-visible, .crown-btn:focus-visible, .opt input:focus-visible { outline: 3px solid var(--hour); outline-offset: 2px; }
.step.h { box-shadow: inset 0 -3px 0 var(--hour); }
.step.m { box-shadow: inset 0 -3px 0 var(--minute); }

.sync-btn {
  display: block;
  margin: 14px auto 0;
  min-height: 44px;
  padding: 8px 20px;
  border: 0;
  border-radius: 22px;
  background: var(--minute);
  color: var(--on-accent);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
.sync-btn:disabled { opacity: .35; cursor: not-allowed; }
.sync-btn:focus-visible { outline: 3px solid var(--hour); outline-offset: 2px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: center; margin-top: 14px; color: var(--muted); font-size: .9rem; }
.opt { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; cursor: pointer; }
.opt input { width: 20px; height: 20px; }
.help { margin: 16px 4px 0; color: var(--muted); font-size: .85rem; }
.help li { margin: 2px 0; }
@media (prefers-reduced-motion: reduce) {
  #crown { transition: none; }
}
</style>
</head>
<body>
<main>
<h1>とけいのれんしゅう</h1>

<div class="clock-wrap">
<svg id="clock" viewBox="-20 0 460 400" role="img" aria-label="アナログ時計">
  <circle cx="200" cy="200" r="188" fill="var(--case)"/>
  <circle cx="200" cy="200" r="176" fill="var(--face)"/>
  <g id="ticks"></g>
  <g id="minute-labels" fill="var(--minute)" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="central"></g>
  <g id="hour-labels" fill="var(--ink)" font-size="32" font-weight="800" text-anchor="middle" dominant-baseline="central"></g>

  <g id="crown" tabindex="0" role="button" aria-pressed="false" aria-label="竜頭">
    <rect class="hit" x="376" y="160" width="60" height="80" fill="transparent"/>
    <rect class="stem" x="372" y="190" width="14" height="20"/>
    <clipPath id="knob-clip"><rect x="386" y="176" width="26" height="48" rx="6"/></clipPath>
    <rect class="knob" x="386" y="176" width="26" height="48" rx="6"/>
    <g clip-path="url(#knob-clip)"><g id="ridges"></g></g>
  </g>

  <g id="hand-hour" style="transform-origin:200px 200px"><line x1="200" y1="214" x2="200" y2="120" stroke="var(--hour)" stroke-width="12" stroke-linecap="round"/></g>
  <g id="hand-minute" style="transform-origin:200px 200px"><line x1="200" y1="214" x2="200" y2="52" stroke="var(--minute)" stroke-width="7" stroke-linecap="round"/></g>
  <g id="hand-second" style="transform-origin:200px 200px">
    <line x1="200" y1="232" x2="200" y2="40" stroke="var(--second)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="200" cy="200" r="7" fill="var(--second)"/>
  </g>
  <circle cx="200" cy="200" r="3" fill="var(--face)"/>
</svg>
</div>

<div class="status" id="status" data-pulled="false" aria-live="polite"></div>
<button class="crown-btn" id="crown-btn" type="button" aria-pressed="false">竜頭をひく</button>

<section class="digital" aria-label="デジタル表示">
  <div class="digital-row">
    <div class="ampm" id="ampm"></div>
    <div class="col">
      <button class="step h" id="h-up" type="button" aria-label="時を1つ進める" disabled>▲</button>
      <div class="num h" id="d-h">00</div>
      <button class="step h" id="h-down" type="button" aria-label="時を1つ戻す" disabled>▼</button>
      <div class="label">じ</div>
    </div>
    <div class="sep">:</div>
    <div class="col">
      <button class="step m" id="m-up" type="button" aria-label="分を1つ進める" disabled>▲</button>
      <div class="num m" id="d-m">00</div>
      <button class="step m" id="m-down" type="button" aria-label="分を1つ戻す" disabled>▼</button>
      <div class="label">ふん</div>
    </div>
    <div class="sep">:</div>
    <div class="col">
      <div class="num s" id="d-s">00</div>
      <div class="label">びょう</div>
    </div>
  </div>
  <button class="sync-btn" id="sync-btn" type="button" disabled>いまのじかんにあわせる</button>
  <div class="opts">
    <label class="opt"><input type="checkbox" id="opt-24"> 24じかんひょうじ</label>
    <label class="opt"><input type="checkbox" id="opt-minlabel" checked> 「ふん」のすうじ</label>
  </div>
</section>

<ul class="help">
  <li>竜頭(とけいの右のつまみ)を右にひっぱると、秒針がとまります。</li>
  <li>ひっぱったまま上下にうごかすと、長針がまわって短針もいっしょにうごきます。</li>
  <li>デジタルの▲▼でも、じかんをあわせられます(おしつづけると、どんどん進みます)。</li>
  <li>竜頭を左におしこむと、あわせたじかんから秒針がうごきだします。</li>
</ul>
</main>

<script>
(() => {
  'use strict';

  const SVG_NS = 'http://www.w3.org/2000/svg';
  const SEC = 1000;
  const MIN = 60 * SEC;
  const HOUR = 60 * MIN;
  const DAY = 24 * HOUR;
  const PULL_DISTANCE = 22;
  const DRAG_PULL_THRESHOLD = 14;
  const DRAG_PX_PER_MINUTE = 7;

  const $ = (id) => document.getElementById(id);
  const mod = (n, m) => ((n % m) + m) % m;

  function svgEl(name, attrs) {
    const el = document.createElementNS(SVG_NS, name);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, String(v));
    return el;
  }

  function polar(r, deg) {
    const rad = (deg - 90) * Math.PI / 180;
    return { x: 200 + r * Math.cos(rad), y: 200 + r * Math.sin(rad) };
  }

  const state = {
    pulled: false,
    offsetMs: 0,
    frozenMs: 0,
    use24: false,
    ridgeShift: 0,
  };

  function localMsOfDay() {
    const d = new Date();
    return ((d.getHours() * 60 + d.getMinutes()) * 60 + d.getSeconds()) * SEC + d.getMilliseconds();
  }

  function currentMs() {
    return state.pulled ? state.frozenMs : mod(localMsOfDay() + state.offsetMs, DAY);
  }

  function buildFace() {
    const ticks = $('ticks');
    for (let i = 0; i < 60; i++) {
      const major = i % 5 === 0;
      const a = polar(major ? 150 : 158, i * 6);
      const b = polar(168, i * 6);
      ticks.appendChild(svgEl('line', {
        x1: a.x, y1: a.y, x2: b.x, y2: b.y,
        stroke: major ? 'var(--ink)' : 'var(--muted)',
        'stroke-width': major ? 4 : 1.5,
        'stroke-linecap': 'round',
      }));
    }
    const minuteLabels = $('minute-labels');
    const hourLabels = $('hour-labels');
    for (let i = 1; i <= 12; i++) {
      const h = polar(103, i * 30);
      const ht = svgEl('text', { x: h.x, y: h.y });
      ht.textContent = String(i);
      hourLabels.appendChild(ht);
      const m = polar(138, i * 30);
      const mt = svgEl('text', { x: m.x, y: m.y });
      mt.textContent = String(i * 5);
      minuteLabels.appendChild(mt);
    }
    const ridges = $('ridges');
    for (let y = 168; y <= 236; y += 6) {
      ridges.appendChild(svgEl('line', { class: 'ridge', x1: 386, x2: 412, y1: y, y2: y }));
    }
  }

  const el = {
    hourHand: $('hand-hour'),
    minuteHand: $('hand-minute'),
    secondHand: $('hand-second'),
    clock: $('clock'),
    crown: $('crown'),
    ridges: $('ridges'),
    crownBtn: $('crown-btn'),
    status: $('status'),
    dh: $('d-h'), dm: $('d-m'), ds: $('d-s'), ampm: $('ampm'),
    steps: ['h-up', 'h-down', 'm-up', 'm-down', 'sync-btn'].map($),
  };

  let lastKey = '';

  function render(force) {
    const ms = currentMs();
    const totalSec = Math.floor(ms / SEC);
    const key = totalSec + '|' + state.use24 + '|' + state.pulled + '|' + state.ridgeShift;
    if (!force && key === lastKey) return;
    lastKey = key;

    const s = totalSec % 60;
    const m = Math.floor(totalSec / 60) % 60;
    const h24 = Math.floor(totalSec / 3600);

    const hourAngle = ((h24 % 12) + m / 60 + s / 3600) * 30;
    const minuteAngle = (m + s / 60) * 6;
    const secondAngle = s * 6;
    el.hourHand.style.transform = `rotate(${hourAngle}deg)`;
    el.minuteHand.style.transform = `rotate(${minuteAngle}deg)`;
    el.secondHand.style.transform = `rotate(${secondAngle}deg)`;

    const pad = (n) => String(n).padStart(2, '0');
    const isPm = h24 >= 12;
    const hDisp = state.use24 ? h24 : (h24 % 12 === 0 ? 12 : h24 % 12);
    el.dh.textContent = state.use24 ? pad(hDisp) : String(hDisp);
    el.dm.textContent = pad(m);
    el.ds.textContent = pad(s);
    el.ampm.textContent = state.use24 ? '' : (isPm ? 'ごご' : 'ごぜん');

    el.ridges.setAttribute('transform', `translate(0 ${state.ridgeShift})`);
    el.clock.setAttribute('aria-label', `アナログ時計 ${isPm ? '午後' : '午前'}${h24 % 12 === 0 ? 12 : h24 % 12}時${m}分`);
  }

  function setPulled(pulled) {
    if (state.pulled === pulled) return;
    if (pulled) {
      state.frozenMs = Math.floor(currentMs() / SEC) * SEC;
    } else {
      state.offsetMs = state.frozenMs - localMsOfDay();
    }
    state.pulled = pulled;

    el.crown.style.transform = pulled ? `translateX(${PULL_DISTANCE}px)` : 'translateX(0)';
    el.crown.setAttribute('aria-pressed', String(pulled));
    el.crownBtn.setAttribute('aria-pressed', String(pulled));
    el.crownBtn.textContent = pulled ? '竜頭をおしこむ' : '竜頭をひく';
    el.status.dataset.pulled = String(pulled);
    el.status.textContent = pulled
      ? '竜頭がひきだされているよ。秒針がとまって、じかんをあわせられます'
      : '秒針がうごいています';
    for (const b of el.steps) b.disabled = !pulled;
    render(true);
  }

  function addMinutes(delta) {
    if (!state.pulled) return;
    state.frozenMs = mod(state.frozenMs + delta * MIN, DAY);
  }

  function addHours(delta) {
    if (!state.pulled) return;
    state.frozenMs = mod(state.frozenMs + delta * HOUR, DAY);
  }

  function addMinuteDigitOnly(delta) {
    if (!state.pulled) return;
    const m = Math.floor(state.frozenMs / MIN) % 60;
    state.frozenMs = mod(state.frozenMs + (mod(m + delta, 60) - m) * MIN, DAY);
  }

  function syncToNow() {
    if (!state.pulled) return;
    state.frozenMs = localMsOfDay();
    setPulled(false);
    state.offsetMs = 0;
    render(true);
  }

  function turnCrown(minutes) {
    if (!state.pulled || minutes === 0) return;
    addMinutes(minutes);
    state.ridgeShift = mod(state.ridgeShift + minutes * 2, 6);
    render(true);
  }

  function setupCrownDrag() {
    let drag = null;
    el.crown.addEventListener('pointerdown', (e) => {
      el.crown.setPointerCapture(e.pointerId);
      drag = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: false, restY: e.clientY };
    });
    el.crown.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const dx = e.clientX - drag.x;
      const rect = el.clock.getBoundingClientRect();
      const unit = rect.width / 460;
      if (!state.pulled && dx > DRAG_PULL_THRESHOLD * unit) {
        setPulled(true);
        drag.moved = true;
        drag.x = e.clientX;
        drag.restY = e.clientY;
        return;
      }
      if (state.pulled && dx < -DRAG_PULL_THRESHOLD * unit) {
        setPulled(false);
        drag.moved = true;
        drag.x = e.clientX;
        return;
      }
      if (state.pulled) {
        const dy = drag.restY - e.clientY;
        const steps = Math.trunc(dy / (DRAG_PX_PER_MINUTE * unit));
        if (steps !== 0) {
          turnCrown(steps);
          drag.restY -= steps * DRAG_PX_PER_MINUTE * unit;
          drag.moved = true;
        }
      }
    });
    const end = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      if (!drag.moved && e.type === 'pointerup') setPulled(!state.pulled);
      drag = null;
    };
    el.crown.addEventListener('pointerup', end);
    el.crown.addEventListener('pointercancel', end);
    el.crown.addEventListener('wheel', (e) => {
      if (!state.pulled) return;
      e.preventDefault();
      turnCrown(e.deltaY < 0 ? 1 : -1);
    }, { passive: false });
    el.crown.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        setPulled(!state.pulled);
      } else if (state.pulled && e.key === 'ArrowUp') {
        e.preventDefault();
        turnCrown(1);
      } else if (state.pulled && e.key === 'ArrowDown') {
        e.preventDefault();
        turnCrown(-1);
      } else if (state.pulled && e.key === 'PageUp') {
        e.preventDefault();
        addHours(1);
        render(true);
      } else if (state.pulled && e.key === 'PageDown') {
        e.preventDefault();
        addHours(-1);
        render(true);
      }
    });
  }

  function setupStepButton(id, action) {
    const btn = $(id);
    let timer = null;
    let repeater = null;
    const stop = () => {
      clearTimeout(timer);
      clearInterval(repeater);
      timer = repeater = null;
    };
    const fire = () => { action(); render(true); };
    btn.addEventListener('pointerdown', (e) => {
      if (btn.disabled) return;
      btn.setPointerCapture(e.pointerId);
      fire();
      timer = setTimeout(() => { repeater = setInterval(fire, 90); }, 420);
    });
    for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) btn.addEventListener(type, stop);
    btn.addEventListener('click', (e) => {
      if (e.detail === 0 && !btn.disabled) fire();
    });
  }

  buildFace();
  setupCrownDrag();
  setupStepButton('h-up', () => addHours(1));
  setupStepButton('h-down', () => addHours(-1));
  setupStepButton('m-up', () => addMinuteDigitOnly(1));
  setupStepButton('m-down', () => addMinuteDigitOnly(-1));
  $('sync-btn').addEventListener('click', syncToNow);
  el.crownBtn.addEventListener('click', () => setPulled(!state.pulled));
  $('opt-24').addEventListener('change', (e) => { state.use24 = e.target.checked; render(true); });
  $('opt-minlabel').addEventListener('change', (e) => {
    $('minute-labels').style.display = e.target.checked ? '' : 'none';
  });

  state.pulled = true;
  state.frozenMs = Math.floor(localMsOfDay() / SEC) * SEC;
  setPulled(false);

  const loop = () => { render(false); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
