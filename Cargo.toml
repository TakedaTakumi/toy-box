[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
proptest = "1"
serde = { version = "1", features = ["derive"] }
# 期待値の浮動小数点を、JS の出力とビット単位で一致させて読むため
serde_json = { version = "1", features = ["float_roundtrip"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
# wasm の大きさを抑えるため、速度の最適化を一段弱める
opt-level = 2
