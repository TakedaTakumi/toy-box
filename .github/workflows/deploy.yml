name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TRUNK_VERSION: 0.22.2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      # rustup 1.28 以降は show だけでは導入しないため、toolchain install で rust-toolchain.toml の版を入れる
      - run: |
          rustup toolchain install
          rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install Trunk
        run: |
          base="https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}"
          archive="trunk-x86_64-unknown-linux-gnu.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSL -O "${base}/${archive}"
          curl -fsSL -O "${base}/${archive}.sha256"
          echo "$(cat "${archive}.sha256")  ${archive}" | sha256sum -c -
          mkdir -p trunk-bin
          tar -xzf "${archive}" -C trunk-bin
          echo "$RUNNER_TEMP/trunk-bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trunk
          key: ${{ runner.os }}-trunk-${{ env.TRUNK_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
      - run: trunk build --release
        working-directory: crates/gregory-editor
      - run: npm run build:docs
      # PRごとのプレビュー(pr-preview/)を消さず、強制pushもしない
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: public
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
